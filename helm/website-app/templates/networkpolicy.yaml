{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.appPolicyName }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: website-app
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    {{- if .Values.database.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace | quote }}
          podSelector:
            matchLabels:
              {{ .Values.networkPolicy.dnsPodLabel }}: {{ .Values.networkPolicy.dnsPodLabelValue | quote }}
      ports:
        - protocol: UDP
          port: {{ .Values.networkPolicy.dnsUdpPort }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.dnsTcpPort }}
    {{- if .Values.database.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tenant-postgres
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
    {{- end }}
---
{{- if .Values.database.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.databasePolicyName }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tenant-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: website-app
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
{{- end }}
{{- end }}
