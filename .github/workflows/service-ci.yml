name: Service CI
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      image:
        required: true
        type: string
permissions:
  contents: read
  packages: write
  security-events: write
concurrency:
  group: service-${{ inputs.service }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service and validation dependencies
        working-directory: services/${{ inputs.service }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff bandit pip-audit
      - name: Python lint
        working-directory: services/${{ inputs.service }}
        run: ruff check src test
      - name: Unit tests
        working-directory: services/${{ inputs.service }}
        run: python -m pytest -q
      - name: Static application security scan
        working-directory: services/${{ inputs.service }}
        run: bandit -q -r src
      - name: Python dependency vulnerability audit
        working-directory: services/${{ inputs.service }}
        run: pip-audit -r requirements.txt --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/${{ inputs.service }}/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          load: true
          tags: local/${{ inputs.image }}:${{ github.sha }}
      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ inputs.image }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Validate container runtime and health check
        shell: bash
        run: |
          docker run -d --name service-under-test -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci local/${{ inputs.image }}:${{ github.sha }}
          trap 'docker logs service-under-test || true; docker rm -f service-under-test >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do
            if docker exec service-under-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health/live', timeout=2)"; then exit 0; fi
            sleep 1
          done
          echo 'Container health endpoint did not become ready' >&2
          exit 1
  publish:
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value={{sha}}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Publish validated image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
