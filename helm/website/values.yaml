tenant:
  name: user1
image:
  repository: ghcr.io/owner/website-app
  tag: latest
  pullPolicy: IfNotPresent
replicaCount: 2
containerPort: 3000
ingress:
  enabled: true
  className: nginx
  host: user1.localtest.me
  clusterIssuer: local-selfsigned
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  cpuUtilization: 60
  memoryUtilization: 75
quota:
  requestsCpu: "4"
  requestsMemory: 4Gi
  # Allow the eight HPA replicas plus the tenant PostgreSQL pod (1 CPU each).
  limitsCpu: "10"
  limitsMemory: 8Gi
  pods: "20"
serviceMonitor:
  enabled: true
  release: prometheus
pdb:
  minAvailable: 1
database:
  enabled: true
  secretName: tenant-db-credentials
  user: website
  name: website
  image: postgres:16-alpine
  storage:
    enabled: true
    size: 5Gi
    storageClassName: ""
eventPublisher:
  enabled: false
  image: yotta/website-orchestrator:local
  bootstrapServers: kafka.platform.svc.cluster.local:19092
  correlationId: ""
