# The UIs are served through the existing ingress-nginx on the Kind HTTPS port (8443, bound to 127.0.0.1 only),
# so nothing new is opened on the Mac. Add the three hostnames to /etc/hosts (see docs/deployment.md).
grafana:
  adminUser: admin
  adminPassword: local-demo-only-change-me
  rbac:
    namespaced: true
  sidecar:
    dashboards:
      searchNamespace: observability
    datasources:
      searchNamespace: observability
  persistence:
    enabled: false
  grafana.ini:
    server:
      root_url: https://grafana.myyotta.com:8443
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: local-selfsigned
    hosts: [grafana.myyotta.com]
    path: /
    tls:
      - secretName: grafana-tls
        hosts: [grafana.myyotta.com]
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      isDefault: false
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: local-selfsigned
    hosts: [prometheus.myyotta.com]
    paths: [/]
    pathType: Prefix
    tls:
      - secretName: prometheus-tls
        hosts: [prometheus.myyotta.com]
  prometheusSpec:
    externalUrl: https://prometheus.myyotta.com:8443
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: prometheus
    retention: 3d
alertmanager:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: local-selfsigned
    hosts: [alertmanager.myyotta.com]
    paths: [/]
    pathType: Prefix
    tls:
      - secretName: alertmanager-tls
        hosts: [alertmanager.myyotta.com]
  alertmanagerSpec:
    externalUrl: https://alertmanager.myyotta.com:8443
kube-state-metrics:
  collectors:
    - certificatesigningrequests
    - configmaps
    - cronjobs
    - daemonsets
    - deployments
    - endpointslices
    - horizontalpodautoscalers
    - ingresses
    - jobs
    - leases
    - limitranges
    - mutatingwebhookconfigurations
    - namespaces
    - networkpolicies
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - poddisruptionbudgets
    - pods
    - replicasets
    - replicationcontrollers
    - resourcequotas
    - services
    - statefulsets
    - storageclasses
    - validatingwebhookconfigurations
    - volumeattachments
prometheus-node-exporter:
  hostNetwork: false
  hostPID: false
