name: Database API
permissions:
  contents: read
  packages: write
  security-events: write
on:
  push:
    branches: [master, feature, 'feature/**']
    paths: ['services/database/**', 'VERSION', 'scripts/build-version.sh', '.trivyignore', '.github/workflows/**']
  pull_request:
    branches: [master, feature, 'feature/**']
    paths: ['services/database/**', 'VERSION', 'scripts/build-version.sh', '.trivyignore', '.github/workflows/**']
  workflow_dispatch:
jobs:
  service:
    if: (github.event_name == 'pull_request' && (github.head_ref == 'master' || github.head_ref == 'feature' || startsWith(github.head_ref, 'feature/'))) || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')))
    uses: ./.github/workflows/service-ci.yml
    with:
      service: database
      image: database-api
  deploy-platform:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: service
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    concurrency:
      group: local-platform-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/database-api:${{ needs.service.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Load the validated API image into Kind
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name yotta-platform
      - name: Upgrade the database API with Helm
        run: |
          helm upgrade --install platform helm/platform --namespace platform --reuse-values \
            --set-string images.databaseApi="$IMAGE" --wait --timeout 10m
          kubectl rollout status deployment/database-api --namespace platform --timeout=5m
