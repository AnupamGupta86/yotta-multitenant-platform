# CI retrigger marker: 2026-11-16 end-to-end check.
name: Platform Deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Fluentd image tag published by Platform CI
        type: string
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: local-platform-release
  cancel-in-progress: false
jobs:
  validate-chart:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.pipeline.outputs.helm_version }}
      - name: Lint and render platform chart
        run: |
          helm lint helm/platform
          helm template "$PLATFORM_RELEASE_NAME" helm/platform --namespace "$PLATFORM_NAMESPACE" > /tmp/platform.yaml
  deploy:
    needs: validate-chart
    if: needs.validate-chart.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    # Manual approval: this job waits until a reviewer approves the deployment of platform add-ons, the platform chart and monitoring.
    # Reviewers are set on the 'platform-deployment' environment (scripts/setup-deployment-approvals.sh).
    environment:
      name: platform-deployment
    permissions:
      actions: write
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - name: Validate the selected image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash .github/scripts/validate-image-tag.sh "$IMAGE_TAG"
      - name: Confirm the local Kind cluster is ready
        run: |
          kind get clusters | grep -qx "$KIND_CLUSTER_NAME"
          helm status "$PLATFORM_RELEASE_NAME" --namespace "$PLATFORM_NAMESPACE"
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$CONTAINER_REGISTRY" --username "$GHCR_USER" --password-stdin
      - name: Normalize the GHCR image owner
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "FLUENTD_IMAGE=$CONTAINER_REGISTRY/$owner/$FLUENTD_IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Load the Fluentd image into Kind (nodes' platform only)
        run: ./scripts/load-image-into-kind.sh "$FLUENTD_IMAGE" "$KIND_CLUSTER_NAME"
      - name: Deploy cluster add-ons through Helm
        run: ./scripts/deploy-cluster-addons.sh
      - name: Read pinned monitoring chart version
        run: echo "PROMETHEUS_CHART_VERSION=$(tr -d '[:space:]' < helm/monitoring/chart-version.txt)" >> "$GITHUB_ENV"
      - name: Add and update monitoring Helm repository
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo update prometheus-community
      - name: Upgrade platform release through Helm
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
          # The orchestrator keeps this token to start Website App Deployment whenever a website is
          # requested, so it must be a long-lived token. The job's own GITHUB_TOKEN is revoked as soon
          # as this job ends, which would make every later request fail with HTTP 401.
          ORCHESTRATOR_GITHUB_TOKEN: ${{ secrets.ORCHESTRATOR_GITHUB_TOKEN }}
        run: |
          if [[ -z "$ORCHESTRATOR_GITHUB_TOKEN" ]]; then
            echo "::error::Add the repository secret ORCHESTRATOR_GITHUB_TOKEN: a fine-grained token for this repository with 'Actions: Read and write' (see docs/deployment.md)."
            exit 2
          fi
          helm upgrade --install "$PLATFORM_RELEASE_NAME" helm/platform --namespace "$PLATFORM_NAMESPACE" --create-namespace \
            --reuse-values --set-string images.fluentd="$FLUENTD_IMAGE" \
            --set-string orchestrator.repository="$GHCR_REPOSITORY" \
            --set-string orchestrator.githubToken= \
            --wait --timeout "$PLATFORM_HELM_TIMEOUT"
          bash .github/scripts/update-orchestrator-token.sh
          kubectl rollout status daemonset/fluentd --namespace "$OBSERVABILITY_NAMESPACE" --timeout="$ROLLOUT_TIMEOUT"
      - name: Upgrade Prometheus and Grafana through Helm
        run: |
          helm upgrade --install "$MONITORING_RELEASE_NAME" prometheus-community/kube-prometheus-stack \
            --version "$PROMETHEUS_CHART_VERSION" \
            --namespace "$OBSERVABILITY_NAMESPACE" --create-namespace \
            --values helm/monitoring/values.yaml --wait --timeout "$PLATFORM_HELM_TIMEOUT"
