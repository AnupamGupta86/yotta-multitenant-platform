apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Values.observabilityNamespace }}
data:
  config.yaml: |
{{ .Files.Get "files/loki-config.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Values.observabilityNamespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
      annotations:
        checksum/config: {{ .Files.Get "files/loki-config.yaml" | sha256sum }}
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loki
          image: {{ .Values.images.loki | quote }}
          args: ["-config.file=/etc/loki/config.yaml"]
          ports: [{name: http, containerPort: 3100}]
          readinessProbe: {httpGet: {path: /ready, port: http}}
          livenessProbe: {httpGet: {path: /ready, port: http}}
          resources: {{- toYaml .Values.observability.loki.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Values.observabilityNamespace }}
spec:
  selector: {app: loki}
  ports: [{name: http, port: 3100, targetPort: http}]
