# CI retrigger marker: 2026-11-15.
name: Website Orchestrator CI
on:
  push:
    branches: ['**']
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-orchestrator-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pipeline.outputs.python_version }}
      - name: Install validation dependencies
        working-directory: services/website-orchestrator
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff bandit pip-audit
      - name: Python lint
        working-directory: services/website-orchestrator
        run: ruff check src test publish_event.py
      - name: Unit tests
        working-directory: services/website-orchestrator
        run: python -m pytest -q
      - name: Static application security scan
        working-directory: services/website-orchestrator
        run: bandit -q -r src publish_event.py
      - name: Dependency vulnerability audit
        working-directory: services/website-orchestrator
        run: pip-audit -r requirements.txt --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/website-orchestrator/Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build orchestrator image
        uses: docker/build-push-action@v7
        with:
          context: services/website-orchestrator
          load: true
          tags: local/website-orchestrator:${{ github.sha }}
      - name: Scan orchestrator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/website-orchestrator:${{ github.sha }}
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Kafka producer and orchestrator integration check
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:${{ steps.pipeline.outputs.kafka_external_port }}
        run: |
          trap 'docker logs orchestrator-under-test 2>/dev/null || true; docker rm -f orchestrator-under-test >/dev/null 2>&1 || true; docker compose down -v' EXIT
          docker compose up -d kafka
          ready=false
          for _ in {1..30}; do
            if docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server "localhost:$KAFKA_EXTERNAL_PORT" --list >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker compose logs kafka
            echo 'Kafka did not become ready' >&2
            exit 1
          fi
          docker run -d --name orchestrator-under-test --network host \
            -e KAFKA_BOOTSTRAP_SERVERS="localhost:$KAFKA_EXTERNAL_PORT" \
            -e ORCHESTRATOR_DRY_RUN=true \
            local/website-orchestrator:${{ github.sha }}
          python services/website-orchestrator/publish_event.py --tenant ci --domain ci.localtest.me --image ci/website:test --event-type WebsiteProvisioningRequested
          for _ in {1..30}; do
            if docker logs orchestrator-under-test 2>&1 | grep -q 'WebsiteProvisioningRequested'; then exit 0; fi
            sleep 2
          done
          docker logs orchestrator-under-test
          echo 'Website orchestrator did not log the published WebsiteProvisioningRequested event' >&2
          exit 1
  publish:
    if: ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Calculate unique image version
        id: version
        run: |
          echo "version=$(./scripts/build-version.sh)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.pipeline.outputs.container_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.pipeline.outputs.container_registry }}/${{ steps.version.outputs.owner }}/${{ steps.pipeline.outputs.website_orchestrator_image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long
            type=raw,value=${{ github.sha }}
            type=raw,value={{sha}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: services/website-orchestrator
          platforms: ${{ steps.pipeline.outputs.image_build_platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Show deployment image reference
        env:
          IMAGE_OWNER: ${{ steps.version.outputs.owner }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: |
          {
            echo '### Deployment image tag'
            echo
            echo "$IMAGE_TAG"
            echo
            echo 'Enter this value in the image_tag field of the Website Orchestrator Deployment workflow.'
            echo "Full image: $CONTAINER_REGISTRY/$IMAGE_OWNER/$WEBSITE_ORCHESTRATOR_IMAGE:$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
