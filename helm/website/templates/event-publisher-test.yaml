{{- if .Values.eventPublisher.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-publish-website-created
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website-event-publisher
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: publish-event
          image: {{ .Values.eventPublisher.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, /app/publish_event.py]
          args:
            - --tenant
            - {{ .Values.tenant.name | quote }}
            - --domain
            - {{ .Values.ingress.host | quote }}
            - --image
            - {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
            - --bootstrap-servers
            - {{ .Values.eventPublisher.bootstrapServers | quote }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
{{- end }}
