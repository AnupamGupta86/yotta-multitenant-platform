apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-orchestrator
  labels:
    app.kubernetes.io/name: website-orchestrator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: website-orchestrator}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website-orchestrator
        app.kubernetes.io/instance: {{ .Release.Name }}
        myyotta.io/database-client: "true"   # allowed through the platform database's NetworkPolicy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: website-orchestrator
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: {{ .Values.kafka.bootstrapServers | quote }}}
            - {name: KAFKA_TOPIC, value: {{ .Values.kafka.topic | quote }}}
            - {name: KAFKA_GROUP_ID, value: {{ .Values.kafka.groupId | quote }}}
            - {name: GH_REPOSITORY, value: {{ .Values.github.repository | quote }}}
            - {name: GH_WORKFLOW_NAME, value: {{ .Values.github.workflow | quote }}}
            - {name: GH_TEARDOWN_WORKFLOW_NAME, value: {{ .Values.github.teardownWorkflow | quote }}}
            - {name: GH_REF, value: {{ .Values.github.ref | quote }}}
            - name: NOTIFICATION_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.notification.secretName }}
                  key: url
                  optional: true
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.tokenSecretName }}
                  key: token
                  optional: true
            - {name: SMTP_HOST, value: {{ .Values.email.smtpHost | quote }}}
            - {name: SMTP_PORT, value: {{ .Values.email.smtpPort | quote }}}
            - {name: NOTIFY_EMAIL_FROM, value: {{ .Values.email.from | quote }}}
            {{- range $env, $key := dict "SMTP_USERNAME" "username" "SMTP_PASSWORD" "password" "NOTIFY_EMAIL_TO" "to" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.email.existingSecret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            - {name: DB_HOST, value: {{ .Values.platformDatabase.host | quote }}}
            - {name: DB_PORT, value: {{ .Values.platformDatabase.port | quote }}}
            - {name: DB_NAME, value: {{ .Values.platformDatabase.name | quote }}}
            - {name: DB_USER, value: {{ .Values.platformDatabase.user | quote }}}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformDatabase.secretName }}
                  key: {{ .Values.platformDatabase.secretKey }}
                  optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
