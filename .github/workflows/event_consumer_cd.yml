name: Kafka event consumer
on:
  push:
    branches: [master, feature, 'feature/**']
    paths: ['services/event-consumer/**', 'docker-compose.yml', 'VERSION', 'scripts/build-version.sh', '.trivyignore', '.github/workflows/event_consumer_cd.yml']
  pull_request:
    branches: [master, feature, 'feature/**']
    paths: ['services/event-consumer/**', 'docker-compose.yml', 'VERSION', 'scripts/build-version.sh', '.trivyignore', '.github/workflows/event_consumer_cd.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: event-consumer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: (github.event_name == 'pull_request' && (github.head_ref == 'master' || github.head_ref == 'feature' || startsWith(github.head_ref, 'feature/'))) || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        working-directory: services/event-consumer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff bandit pip-audit
      - name: Python lint
        working-directory: services/event-consumer
        run: ruff check src test publish_event.py
      - name: Unit tests
        working-directory: services/event-consumer
        run: python -m pytest -q
      - name: Static application security scan
        working-directory: services/event-consumer
        run: bandit -q -r src publish_event.py
      - name: Dependency vulnerability audit
        working-directory: services/event-consumer
        run: pip-audit -r requirements.txt --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/event-consumer/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build consumer image
        uses: docker/build-push-action@v6
        with:
          context: services/event-consumer
          load: true
          tags: local/website-event-consumer:${{ github.sha }}
      - name: Scan consumer image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/website-event-consumer:${{ github.sha }}
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Kafka producer and consumer integration check
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          trap 'docker logs consumer-under-test 2>/dev/null || true; docker rm -f consumer-under-test >/dev/null 2>&1 || true; docker compose down -v' EXIT
          docker compose up -d kafka
          ready=false
          for _ in {1..30}; do
            if docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker compose logs kafka
            echo 'Kafka did not become ready' >&2
            exit 1
          fi
          docker run -d --name consumer-under-test --network host \
            -e KAFKA_BOOTSTRAP_SERVERS=localhost:9092 \
            -e ORCHESTRATOR_DRY_RUN=true \
            local/website-event-consumer:${{ github.sha }}
          python services/event-consumer/publish_event.py --tenant ci --domain ci.localtest.me --image ci/website:test --event-type WebsiteProvisioningRequested
          for _ in {1..30}; do
            if docker logs consumer-under-test 2>&1 | grep -q 'WebsiteProvisioningRequested'; then exit 0; fi
            sleep 2
          done
          docker logs consumer-under-test
          echo 'Consumer did not log the published WebsiteProvisioningRequested event' >&2
          exit 1
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Calculate unique image version
        id: version
        run: |
          echo "version=$(./scripts/build-version.sh)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.version.outputs.owner }}/website-event-consumer
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long
            type=raw,value=${{ github.sha }}
            type=raw,value={{sha}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: services/event-consumer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
  deploy-platform:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: publish
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: local-platform-release
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ needs.publish.outputs.owner }}/website-event-consumer:${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Load the validated orchestrator image into Kind
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name yotta-platform
      - name: Upgrade the deployment orchestrator with Helm
        run: |
          helm upgrade --install platform helm/platform --namespace platform --reuse-values \
            --set-string images.eventConsumer="$IMAGE" --wait --timeout 10m
          kubectl rollout status deployment/event-consumer --namespace platform --timeout=5m
