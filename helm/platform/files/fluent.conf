<system>
  log_level {{ .Values.observability.fluentd.logLevel }}
</system>
<source>
  @type tail
  path {{ .Values.observability.fluentd.containerLogsPath }}
  pos_file {{ .Values.observability.fluentd.positionFile }}
  tag kubernetes.*
  read_from_head {{ .Values.observability.fluentd.readFromHead }}
  <parse>
    @type regexp
    expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$/
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%N%:z
    time_type string
  </parse>
</source>
<filter kubernetes.**>
  @type kubernetes_metadata
</filter>
<match kubernetes.**>
  @type loki
  url {{ .Values.observability.fluentd.lokiUrl }}
  extra_labels {"cluster":"{{ .Values.observability.fluentd.clusterLabel }}","job":"{{ .Values.observability.fluentd.jobLabel }}"}
  extract_kubernetes_labels true
  <label>
    namespace $.kubernetes.namespace_name
    container $.kubernetes.container_name
  </label>
  line_format json
  flush_interval {{ .Values.observability.fluentd.flushInterval }}
  flush_at_shutdown {{ .Values.observability.fluentd.flushAtShutdown }}
  buffer_chunk_limit {{ .Values.observability.fluentd.bufferChunkLimit }}
  buffer_queue_limit {{ .Values.observability.fluentd.bufferQueueLimit }}
</match>
