apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.observability.fluentd.serviceAccountName }}
  namespace: {{ .Values.observabilityNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-fluentd
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-fluentd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-fluentd
subjects:
  - kind: ServiceAccount
    name: {{ .Values.observability.fluentd.serviceAccountName }}
    namespace: {{ .Values.observabilityNamespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.observability.fluentd.configMapName }}
  namespace: {{ .Values.observabilityNamespace }}
data:
  fluent.conf: |
{{ tpl (.Files.Get "files/fluent.conf") . | indent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.observability.fluentd.daemonSetName }}
  namespace: {{ .Values.observabilityNamespace }}
spec:
  selector:
    matchLabels: {app: fluentd}
  template:
    metadata:
      labels: {app: fluentd}
      annotations:
        checksum/config: {{ tpl (.Files.Get "files/fluent.conf") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.observability.fluentd.serviceAccountName }}
      tolerations: [{operator: Exists}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-private-temp-directory
          image: {{ .Values.images.fluentd | quote }}
          command: [sh, -ec, {{ printf "mkdir -p %s && chmod 700 %s" .Values.observability.fluentd.tmpDirectory .Values.observability.fluentd.tmpDirectory | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: {{ .Values.observability.fluentd.daemonSetName }}
          image: {{ .Values.images.fluentd | quote }}
          imagePullPolicy: {{ .Values.observability.fluentd.imagePullPolicy }}
          env:
            - {name: TMPDIR, value: {{ .Values.observability.fluentd.tmpDirectory | quote }}}
          resources: {{- toYaml .Values.observability.fluentd.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /fluentd/etc/fluent.conf, subPath: fluent.conf}
            - {name: containers, mountPath: {{ .Values.observability.fluentd.hostPaths.containers | quote }}, readOnly: true}
            - {name: pods, mountPath: {{ .Values.observability.fluentd.hostPaths.pods | quote }}, readOnly: true}
            - {name: buffer, mountPath: {{ .Values.observability.fluentd.bufferDirectory | quote }}}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ .Values.observability.fluentd.configMapName }}}
        - name: containers
          hostPath: {path: {{ .Values.observability.fluentd.hostPaths.containers | quote }}}
        - name: pods
          hostPath: {path: {{ .Values.observability.fluentd.hostPaths.pods | quote }}}
        - name: buffer
          emptyDir: {}
        - name: tmp
          emptyDir: {}
