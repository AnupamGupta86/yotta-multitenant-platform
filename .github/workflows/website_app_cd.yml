# CI retrigger marker: 2026-11-16 end-to-end check.
name: Website App Deployment
on:
  workflow_dispatch:
    inputs:
      tenant:
        description: DNS-safe tenant name from the provisioning request
        type: string
        required: true
      domain:
        description: Requested domain name
        type: string
        required: true
      image_tag:
        description: website-app image tag to deploy (empty = the newest published one)
        type: string
        required: false
      orchestrator_image_tag:
        description: website-orchestrator image tag for the deployment event (empty = the one running in the cluster)
        type: string
        required: false
      correlation_id:
        description: Provisioning request event ID
        type: string
        required: false
      simulate_failure:
        description: 'Rollback demo: deploy a broken readiness probe so Helm rolls back and a WebsiteDeploymentFailed event is sent'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  packages: read
concurrency:
  group: local-platform-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    # Manual approval: this job waits until a reviewer approves the deployment of a tenant's website.
    # Reviewers are set on the 'website-app-deployment' environment (scripts/setup-deployment-approvals.sh).
    environment:
      name: website-app-deployment
    timeout-minutes: 30
    env:
      TENANT: ${{ inputs.tenant }}
      DOMAIN: ${{ inputs.domain }}
      IMAGE_TAG: ${{ inputs.image_tag || '' }}
      ORCHESTRATOR_IMAGE_TAG: ${{ inputs.orchestrator_image_tag || '' }}
      CORRELATION_ID: ${{ inputs.correlation_id || '' }}
      SIMULATE_FAILURE: ${{ inputs.simulate_failure && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - name: Confirm local Kind cluster and platform services
        run: |
          kind get clusters | grep -qx "$KIND_CLUSTER_NAME"
          helm status "$PLATFORM_RELEASE_NAME" --namespace "$PLATFORM_NAMESPACE"
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$CONTAINER_REGISTRY" --username "$GHCR_USER" --password-stdin
      - name: Choose the images (requested tags, or newest website-app + running orchestrator)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/resolve-website-images.sh
      # No actions/setup-python here: on a self-hosted Mac its Python 3.11+ packages install into
      # /Users/runner/hostedtoolcache (a path baked in for GitHub's own runners), which fails with
      # "mkdir: /Users/runner: Permission denied". The job only needs Python to publish a Kafka
      # event, so it uses the Mac's own python3 in a throwaway virtual environment.
      - name: Install the Kafka event publisher (Mac's python3 + virtual environment)
        run: |
          command -v python3 >/dev/null || { echo "::error::python3 is not installed on the runner Mac"; exit 1; }
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version' \
            || { echo "::error::The runner Mac needs Python 3.9 or newer (found $(python3 --version))"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --disable-pip-version-check \
            -r services/website-orchestrator/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"   # later steps: python = this environment
          "$RUNNER_TEMP/venv/bin/python" --version
      - name: Open Kafka port-forward for deployment events
        run: |
          kubectl port-forward --namespace "$PLATFORM_NAMESPACE" service/"$KAFKA_SERVICE_NAME" "${KAFKA_FORWARD_LOCAL_PORT}:${KAFKA_EXTERNAL_PORT}" > /tmp/kafka-port-forward.log 2>&1 &
          echo "$!" > /tmp/kafka-port-forward.pid
          for _ in {1..30}; do
            if nc -z 127.0.0.1 "$KAFKA_FORWARD_LOCAL_PORT"; then exit 0; fi
            sleep 1
          done
          cat /tmp/kafka-port-forward.log
          echo 'Kafka port-forward did not become ready.' >&2
          exit 1
      - name: Deploy the requested tenant with Helm
        id: deploy
        continue-on-error: true
        run: ./scripts/deploy-tenant.sh "$TENANT" "$DOMAIN" "$IMAGE" "$ORCHESTRATOR_IMAGE" "$CORRELATION_ID"
      - name: Publish deployment failure event
        if: steps.deploy.outcome == 'failure'
        run: |
          python services/website-orchestrator/publish_event.py \
            --tenant "$TENANT" --domain "$DOMAIN" --image "$IMAGE" \
            --event-type WebsiteDeploymentFailed --correlation-id "$CORRELATION_ID" \
            --error 'Helm rollout or deployment health check failed' \
            --bootstrap-servers "127.0.0.1:$KAFKA_FORWARD_LOCAL_PORT"
      - name: Stop Kafka port-forward
        if: always()
        run: |
          if [[ -f /tmp/kafka-port-forward.pid ]]; then
            kill "$(cat /tmp/kafka-port-forward.pid)" 2>/dev/null || true
            rm -f /tmp/kafka-port-forward.pid
          fi
      - name: Fail the workflow when Helm deployment failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
      - name: Capture deployment evidence
        if: always()
        run: |
          mkdir -p output
          kubectl get all,hpa,pdb,resourcequota,ingress --namespace "$TENANT" > "output/${TENANT}-resources.txt" 2>&1 || true
          # Release revisions: after a failed deploy this shows the failed revision and the rollback
          helm history "$TENANT" --namespace "$TENANT" > "output/${TENANT}-helm-history.txt" 2>&1 || true
          kubectl get events --namespace "$TENANT" --sort-by=.lastTimestamp > "output/${TENANT}-events.txt" 2>&1 || true
          kubectl logs --namespace "$PLATFORM_NAMESPACE" deployment/"$WEBSITE_ORCHESTRATOR_DEPLOYMENT" --tail=100 > output/kafka-events.log 2>&1 || true
          kubectl get pods --all-namespaces -o wide > output/cluster-pods.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-deployment-evidence-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
