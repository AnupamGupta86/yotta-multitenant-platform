# CI retrigger marker: 2026-11-16 19:30 IST end-to-end check.
name: Platform Deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Fluentd image tag published by Platform CI
        type: string
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: local-platform-release
  cancel-in-progress: false
jobs:
  validate-chart:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    # Lint, render and schema-check (kubeconform) the chart with this run's values before anything is reviewed or approved.
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.pipeline.outputs.helm_version }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.pipeline.outputs.go_version }}
      - name: Install Kubernetes manifest validator
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v${{ steps.pipeline.outputs.kubeconform_version }}
      - name: Validate the kafka chart
        run: bash .github/scripts/validate-chart.sh "$KAFKA_RELEASE_NAME" helm/kafka-helm --namespace "$PLATFORM_NAMESPACE"
      - name: Validate the logging chart (Loki, Fluentd)
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          bash .github/scripts/validate-chart.sh "$LOGGING_RELEASE_NAME" helm/logging-helm --namespace "$OBSERVABILITY_NAMESPACE" \
            --set-string images.fluentd="$CONTAINER_REGISTRY/$owner/$FLUENTD_IMAGE_NAME:$IMAGE_TAG"
      - name: Validate the Grafana dashboards and ClusterIssuer charts
        run: |
          bash .github/scripts/validate-chart.sh "$GRAFANA_DASHBOARDS_RELEASE_NAME" helm/monitoring/grafana-dashboards \
            --namespace "$OBSERVABILITY_NAMESPACE"
          bash .github/scripts/validate-chart.sh cluster-issuer helm/cluster-addons/cluster-issuer --namespace cert-manager
      - name: Validate the monitoring chart with our values
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm pull prometheus-community/kube-prometheus-stack --version "$(tr -d '[:space:]' < helm/monitoring/chart-version.txt)" \
            --untar --untardir /tmp/monitoring-chart
          bash .github/scripts/validate-chart.sh "$MONITORING_RELEASE_NAME" /tmp/monitoring-chart/kube-prometheus-stack \
            --namespace "$OBSERVABILITY_NAMESPACE" --values helm/monitoring/values.yaml
  review-changes:
    needs: validate-chart
    if: needs.validate-chart.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    # No approval: compares the deployed releases with this change (helm diff), so the reviewer reads
    # the diff in this job's log or the run summary before approving the deploy job.
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      HELM_MODE: diff
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - name: Validate the selected image tag
        run: bash .github/scripts/validate-image-tag.sh "$IMAGE_TAG"
      - name: Confirm the local Kind cluster is running
        run: kind get clusters | grep -qx "$KIND_CLUSTER_NAME"
      - name: Choose the Fluentd image
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "FLUENTD_IMAGE=$CONTAINER_REGISTRY/$owner/$FLUENTD_IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: "One-time move: legacy platform release (what the deploy job removes)"
        run: bash .github/scripts/remove-legacy-platform-release.sh
      - name: "Changes: cluster add-ons and ClusterIssuer (deployed vs new)"
        run: ./scripts/deploy-cluster-addons.sh
      - name: "Changes: monitoring and Grafana dashboards (deployed vs new)"
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo update prometheus-community
          .github/scripts/helm-releases.sh monitoring
      - name: "Changes: logging release - Loki, Fluentd (deployed vs new)"
        run: .github/scripts/helm-releases.sh logging
      - name: "Changes: kafka release (deployed vs new)"
        run: .github/scripts/helm-releases.sh kafka
      - uses: actions/upload-artifact@v6
        with:
          name: helm-diff-${{ github.run_id }}
          path: ${{ runner.temp }}/helm-diff/
          if-no-files-found: warn
          retention-days: 14
  deploy:
    needs: review-changes
    if: needs.review-changes.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    # Manual approval: this job waits until a reviewer approves the deployment of the cluster add-ons, monitoring, logging and Kafka.
    # Reviewers are set on the 'platform-deployment' environment (scripts/setup-deployment-approvals.sh).
    environment:
      name: platform-deployment
    permissions:
      actions: write
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - name: Validate the selected image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash .github/scripts/validate-image-tag.sh "$IMAGE_TAG"
      - name: Confirm the local Kind cluster is running
        run: kind get clusters | grep -qx "$KIND_CLUSTER_NAME"
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$CONTAINER_REGISTRY" --username "$GHCR_USER" --password-stdin
      - name: Normalize the GHCR image owner
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "FLUENTD_IMAGE=$CONTAINER_REGISTRY/$owner/$FLUENTD_IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Load the Fluentd image into Kind (nodes' platform only)
        run: ./scripts/load-image-into-kind.sh "$FLUENTD_IMAGE" "$KIND_CLUSTER_NAME"
      - name: "One-time move: remove the legacy platform release (Kafka data is kept)"
        run: bash .github/scripts/remove-legacy-platform-release.sh
      - name: Deploy cluster add-ons and the ClusterIssuer through Helm
        run: ./scripts/deploy-cluster-addons.sh
      - name: Add and update monitoring Helm repository
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo update prometheus-community
      # Monitoring first: its ServiceMonitor CRD lets the kafka release add the kafka-exporter ServiceMonitor
      - name: Upgrade Prometheus, Grafana and the Grafana dashboards through Helm
        run: .github/scripts/helm-releases.sh monitoring
      - name: Upgrade the logging release (Loki, Fluentd) through Helm
        run: |
          .github/scripts/helm-releases.sh logging
          kubectl rollout status daemonset/fluentd --namespace "$OBSERVABILITY_NAMESPACE" --timeout="$ROLLOUT_TIMEOUT"
      - name: Upgrade the kafka release through Helm
        run: |
          .github/scripts/helm-releases.sh kafka
          kubectl rollout status statefulset/"$KAFKA_SERVICE_NAME" --namespace "$PLATFORM_NAMESPACE" --timeout="$ROLLOUT_TIMEOUT"
