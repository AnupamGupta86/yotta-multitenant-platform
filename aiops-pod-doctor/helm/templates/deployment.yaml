{{- if .Values.liveDoctor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels: {app.kubernetes.io/name: {{ .Values.name }}}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Values.name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Values.name }}}
      annotations:
        aiops/grok-key-revision: {{ .Values.grok.keyRevision | quote }}
    spec:
      serviceAccountName: {{ .Values.name }}
      # The doctor reads pods through the Kubernetes API, so it needs its (read-only) token
      automountServiceAccountToken: true
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: PORT, value: {{ .Values.port | quote }}}
            - {name: POLL_INTERVAL_SECONDS, value: {{ .Values.pollIntervalSeconds | quote }}}
            {{- include "aiops.env" . | nindent 12 }}
          volumeMounts:
            {{- include "aiops.volumeMounts" . | nindent 12 }}
          ports: [{name: http, containerPort: {{ .Values.port }}}]
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "aiops.containerSecurityContext" . | nindent 12 }}
      volumes:
        {{- include "aiops.volumes" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels: {app.kubernetes.io/name: {{ .Values.name }}}
spec:
  selector: {app.kubernetes.io/name: {{ .Values.name }}}
  ports: [{name: http, port: 80, targetPort: http}]
{{- end }}
