name: AIOps Pod Doctor Deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published aiops-pod-doctor image tag to deploy (see the CI run summary)
        type: string
        required: true
      demo_failure:
        description: 'Optional negative test: break a demo pod first, so the report run has a failure to e-mail'
        type: choice
        default: none
        options: [crash, image-pull, missing-secret, none]
permissions:
  contents: read
  packages: read
jobs:
  validate-chart:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.pipeline.outputs.helm_version }}
      - name: Lint and render the AIOps chart
        run: |
          helm lint aiops-pod-doctor/helm
          helm template "$AIOPS_DEPLOYMENT" aiops-pod-doctor/helm --namespace "$AIOPS_NAMESPACE" > /tmp/aiops-pod-doctor.yaml
  deploy:
    needs: validate-chart
    if: needs.validate-chart.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    # Manual approval: this job waits until a reviewer approves it.
    # The 'aiops-deployment' environment also holds the GROK_API_KEY secret (and optionally a GROK_MODEL variable).
    environment:
      name: aiops-deployment
    timeout-minutes: 20
    concurrency:
      group: local-platform-release
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      DEMO_FAILURE: ${{ inputs.demo_failure }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - name: Validate the selected image tag
        run: bash .github/scripts/validate-image-tag.sh "$IMAGE_TAG"
      - name: Confirm the local Kind cluster is running
        run: kind get clusters | grep -qx "$KIND_CLUSTER_NAME"
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$CONTAINER_REGISTRY" --username "$GHCR_USER" --password-stdin
      - name: Choose the image
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$CONTAINER_REGISTRY/$owner/$AIOPS_IMAGE:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Load the image into Kind (nodes' platform only)
        run: ./scripts/load-image-into-kind.sh "$IMAGE" "$KIND_CLUSTER_NAME"
      - name: Store the Grok API key in the cluster
        env:
          # From Settings -> Environments -> aiops-deployment -> Environment secrets
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          if [[ -z "$GROK_API_KEY" ]]; then
            echo "::error title=Missing GROK_API_KEY::Add the secret GROK_API_KEY to the 'aiops-deployment' environment: gh secret set GROK_API_KEY --env aiops-deployment"
            exit 2
          fi
          kubectl create namespace "$AIOPS_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          # Key is read from stdin, so it never appears on a command line
          printf '%s' "$GROK_API_KEY" | kubectl create secret generic "$AIOPS_GROK_SECRET" \
            --namespace "$AIOPS_NAMESPACE" --from-file=api-key=/dev/stdin \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Store the e-mail login in the cluster
        env:
          # From Settings -> Environments -> aiops-deployment -> Environment secrets
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          if [[ -z "$SMTP_USERNAME" || -z "$SMTP_PASSWORD" || -z "$REPORT_EMAIL_TO" ]]; then
            echo "::error title=E-mail not configured::Add SMTP_USERNAME, SMTP_PASSWORD and REPORT_EMAIL_TO to the 'aiops-deployment' environment (gh secret set <NAME> --env aiops-deployment)"
            exit 2
          fi
          # Values go through files readable only by this job, never through a command line
          secret_dir="$(mktemp -d "$RUNNER_TEMP/smtp.XXXXXX")"
          trap 'rm -rf "$secret_dir"' EXIT
          (umask 077
           printf '%s' "$SMTP_USERNAME" > "$secret_dir/username"
           printf '%s' "$SMTP_PASSWORD" > "$secret_dir/password"
           printf '%s' "$REPORT_EMAIL_TO" > "$secret_dir/to")
          kubectl create secret generic "$AIOPS_SMTP_SECRET" --namespace "$AIOPS_NAMESPACE" \
            --from-file=username="$secret_dir/username" --from-file=password="$secret_dir/password" \
            --from-file=to="$secret_dir/to" --dry-run=client -o yaml | kubectl apply -f -
      - name: Install or upgrade the AIOps pod doctor through Helm
        env:
          GROK_MODEL: ${{ vars.GROK_MODEL || 'grok-4' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
        run: |
          helm upgrade --install "$AIOPS_DEPLOYMENT" aiops-pod-doctor/helm \
            --namespace "$AIOPS_NAMESPACE" \
            --set-string image.repository="${IMAGE%:*}" \
            --set-string image.tag="${IMAGE##*:}" \
            --set-string grok.existingSecret="$AIOPS_GROK_SECRET" \
            --set-string grok.model="$GROK_MODEL" \
            --set-string email.existingSecret="$AIOPS_SMTP_SECRET" \
            --set-string email.smtpHost="$SMTP_HOST" \
            --set-string email.smtpPort="$SMTP_PORT" \
            --wait --timeout "$SERVICE_HELM_TIMEOUT"
          kubectl get cronjob "$AIOPS_REPORT_CRONJOB" --namespace "$AIOPS_NAMESPACE"
      - name: 'Negative test: break a demo pod'
        if: inputs.demo_failure != 'none'
        run: |
          pod="$(AIOPS_DEMO_NAMESPACE="$AIOPS_DEMO_NAMESPACE" ./aiops-pod-doctor/scripts/demo-failure.sh "$DEMO_FAILURE")"
          echo "DEMO_POD=$pod" >> "$GITHUB_ENV"
          echo "Created $AIOPS_DEMO_NAMESPACE/$pod ($DEMO_FAILURE)"
      - name: 'Negative test: wait until the demo pod is failing'
        if: inputs.demo_failure != 'none'
        run: |
          for _ in {1..24}; do
            reason="$(kubectl get pod "$DEMO_POD" -n "$AIOPS_DEMO_NAMESPACE" -o jsonpath='{.status.containerStatuses[0].state.waiting.reason}' 2>/dev/null || true)"
            echo "demo pod state: ${reason:-starting}"
            case "$reason" in CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError) exit 0 ;; esac
            sleep 5
          done
          echo "::error::Demo pod $DEMO_POD did not reach a failing state in 2 minutes"
          exit 1
      - name: Run the failure report once now (RCA + e-mail)
        run: bash aiops-pod-doctor/scripts/run-report-job.sh "aiops-report-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Remove the demo pod
        if: always() && inputs.demo_failure != 'none'
        run: AIOPS_DEMO_NAMESPACE="$AIOPS_DEMO_NAMESPACE" ./aiops-pod-doctor/scripts/demo-failure.sh cleanup
