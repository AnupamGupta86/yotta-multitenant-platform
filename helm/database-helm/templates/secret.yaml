{{- if .Values.secret.create }}
{{- /* Generate the password once; on every later upgrade reuse the one already in the cluster */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secret.name }}
{{- $password := randAlphaNum (int .Values.secret.passwordLength) }}
{{- if and $existing (index $existing.data .Values.secret.key) }}
{{- $password = index $existing.data .Values.secret.key | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  annotations:
    # Survives helm uninstall: the data on the volume was initialized with this password
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.secret.key }}: {{ $password | quote }}
{{- end }}
