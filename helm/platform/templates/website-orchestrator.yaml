apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-orchestrator
  labels: {app.kubernetes.io/name: website-orchestrator}
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: website-orchestrator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: website-orchestrator}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: website-orchestrator
          image: {{ .Values.images.websiteOrchestrator | quote }}
          imagePullPolicy: {{ .Values.orchestrator.imagePullPolicy }}
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: {{ printf "%s:%v" .Values.kafka.name .Values.kafka.ports.internal | quote }}}
            - {name: KAFKA_TOPIC, value: {{ .Values.orchestrator.kafkaTopic | quote }}}
            - {name: KAFKA_GROUP_ID, value: {{ .Values.orchestrator.kafkaGroupId | quote }}}
            - {name: GH_REPOSITORY, value: {{ .Values.orchestrator.repository | quote }}}
            - {name: GH_WORKFLOW_NAME, value: {{ .Values.orchestrator.workflow | quote }}}
            - {name: GH_REF, value: {{ .Values.orchestrator.ref | quote }}}
            - name: NOTIFICATION_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.notification.secretName }}
                  key: url
                  optional: true
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.orchestratorTokenName }}
                  key: token
                  optional: true
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
