# Weekly update PRs, grouped per ecosystem so each week brings at most a few PRs.
# Every PR runs the normal CI (tests, scans, image build) before anyone merges it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /services/website-app
      - /services/website-provisioning
      - /services/website-orchestrator
      - /aiops-pod-doctor/service
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /services/website-app
      - /services/website-provisioning
      - /services/website-orchestrator
      - /aiops-pod-doctor/service
      - /helm/monitoring/fluentd
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
