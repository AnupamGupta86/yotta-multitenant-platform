{{- if .Values.database.enabled -}}
{{- $name := .Values.database.secretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := randAlphaNum (int .Values.database.secretLength) -}}
{{- if $existing -}}{{- $password = index $existing.data "password" | b64dec -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  annotations:
    # Survives helm uninstall, so a reinstall reuses the password of the data already on the volume
    helm.sh/resource-policy: keep
  name: {{ $name }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
