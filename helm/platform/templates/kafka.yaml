apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: kafka}
  ports:
    - {name: controller, port: 9093, targetPort: controller}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: {app.kubernetes.io/name: kafka}
  ports:
    - {name: internal, port: 19092, targetPort: internal}
    - {name: external, port: 9092, targetPort: external}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kafka}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-kafka-config
          image: {{ .Values.images.kafka | quote }}
          command: [sh, -ec, "cp -r /opt/kafka/config/. /config/ && chmod -R u+w /config"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: kafka-config, mountPath: /config}
      containers:
        - name: kafka
          image: {{ .Values.images.kafka | quote }}
          ports:
            - {name: controller, containerPort: 9093}
            - {name: internal, containerPort: 19092}
            - {name: external, containerPort: 9092}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:19092,EXTERNAL://localhost:19092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka-headless.platform.svc.cluster.local:9093"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_NUM_PARTITIONS, value: "1"}
          readinessProbe:
            exec:
              command: [sh, -c, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: kafka-config, mountPath: /opt/kafka/config}
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: kafka-config, emptyDir: {}}
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-consumer
  labels: {app.kubernetes.io/name: event-consumer}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: event-consumer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: event-consumer}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: event-consumer
          image: {{ .Values.images.eventConsumer | quote }}
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:19092"}
            - {name: KAFKA_TOPIC, value: website-events}
            - {name: GH_REPOSITORY, value: {{ .Values.orchestrator.repository | quote }}}
            - {name: GH_WORKFLOW_NAME, value: {{ .Values.orchestrator.workflow | quote }}}
            - {name: GH_REF, value: {{ .Values.orchestrator.ref | quote }}}
            - name: NOTIFICATION_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: notification-webhook
                  key: url
                  optional: true
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orchestrator-github-token
                  key: token
                  optional: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
