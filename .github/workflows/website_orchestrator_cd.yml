# CI retrigger marker: 2026-11-15.
name: Website Orchestrator Deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact published website-orchestrator image tag from the CI run summary
        type: string
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: local-platform-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    environment: platform
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the selected image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'image_tag must be a valid container image tag.' >&2
            exit 2
          fi
      - name: Confirm the local Kind cluster and platform are ready
        run: |
          kind get clusters | grep -qx yotta-platform
          helm status platform --namespace platform
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Normalize image owner for GHCR
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/$owner/website-orchestrator:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Pull and load the selected website orchestrator image into Kind
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name yotta-platform
      - name: Upgrade the deployment orchestrator with Helm
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$GHCR_TOKEN" ]]; then
            echo 'Repository Actions secret GHCR_TOKEN is required.' >&2
            exit 2
          fi
          helm upgrade --install platform helm/platform --namespace platform --reuse-values \
            --set-string images.websiteOrchestrator="$IMAGE" \
            --set-string orchestrator.repository="$GHCR_REPOSITORY" \
            --set-string orchestrator.githubToken="$GHCR_TOKEN" \
            --wait --timeout 10m
          kubectl rollout status deployment/website-orchestrator --namespace platform --timeout=5m
