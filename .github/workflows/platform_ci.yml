# CI retrigger marker: 2026-11-16 19:30 IST end-to-end check.
name: Platform CI
on:
  push:
    branches: [master, feature, 'feature/**']
    paths:
      - 'helm/kafka-helm/**'
      - 'helm/logging-helm/**'
      - 'helm/monitoring/**'
      - 'helm/cluster-addons/**'
      - 'kind/**'
      - 'scripts/setup-kind.sh'
      - 'scripts/deploy-cluster-addons.sh'
      - 'scripts/cluster-addons.env'
      - 'scripts/build-version.sh'
      - 'VERSION'
      - '.trivyignore'
      - '.github/workflows/platform_ci.yml'
      - '.github/workflows/platform_cd.yml'
      - '.github/pipeline-config.env'
      - '.github/scripts/**'
  pull_request:
    branches: [master, feature, 'feature/**']
    paths:
      - 'helm/kafka-helm/**'
      - 'helm/logging-helm/**'
      - 'helm/monitoring/**'
      - 'helm/cluster-addons/**'
      - 'kind/**'
      - 'scripts/setup-kind.sh'
      - 'scripts/deploy-cluster-addons.sh'
      - 'scripts/cluster-addons.env'
      - 'scripts/build-version.sh'
      - 'VERSION'
      - '.trivyignore'
      - '.github/workflows/platform_ci.yml'
      - '.github/workflows/platform_cd.yml'
      - '.github/pipeline-config.env'
      - '.github/scripts/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    if: (github.event_name == 'pull_request' && (github.head_ref == 'master' || github.head_ref == 'feature' || startsWith(github.head_ref, 'feature/'))) || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.pipeline.outputs.helm_version }}
      - name: Add and update Helm repositories
        run: |
          helm repo add projectcalico https://docs.tigera.io/calico/charts
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
      - name: Lint and render the project Helm charts
        run: |
          mkdir -p /tmp/rendered-platform /tmp/rendered-monitoring
          # Shared platform charts: kafka, logging (Loki + Fluentd), Grafana dashboards, ClusterIssuer
          helm lint helm/kafka-helm
          helm lint helm/logging-helm
          helm lint helm/monitoring/grafana-dashboards
          helm lint helm/cluster-addons/cluster-issuer
          helm template "$KAFKA_RELEASE_NAME" helm/kafka-helm --namespace "$PLATFORM_NAMESPACE" > /tmp/rendered-platform/kafka.yaml
          helm template "$LOGGING_RELEASE_NAME" helm/logging-helm --namespace "$OBSERVABILITY_NAMESPACE" > /tmp/rendered-platform/logging.yaml
          helm template "$GRAFANA_DASHBOARDS_RELEASE_NAME" helm/monitoring/grafana-dashboards \
            --namespace "$OBSERVABILITY_NAMESPACE" > /tmp/rendered-platform/grafana-dashboards.yaml
          helm template cluster-issuer helm/cluster-addons/cluster-issuer --namespace cert-manager \
            > /tmp/rendered-platform/cluster-issuer.yaml
          awk '
            /^  fluent.conf: \|$/ { in_config = 1; found = 1; next }
            in_config && /^    / { sub(/^    /, ""); print; next }
            in_config { exit }
            END { if (!found) exit 1 }
          ' /tmp/rendered-platform/logging.yaml > /tmp/fluent.conf
          test -s /tmp/fluent.conf
          chart_version="$(tr -d '[:space:]' < helm/monitoring/chart-version.txt)"
          mkdir -p /tmp/monitoring-chart
          helm pull prometheus-community/kube-prometheus-stack \
            --version "$chart_version" --untar --untardir /tmp/monitoring-chart
          helm lint /tmp/monitoring-chart/kube-prometheus-stack \
            --values helm/monitoring/values.yaml
          helm template prometheus /tmp/monitoring-chart/kube-prometheus-stack \
            --namespace "$OBSERVABILITY_NAMESPACE" --values helm/monitoring/values.yaml \
            > /tmp/rendered-monitoring/prometheus.yaml
      - name: Render pinned cluster add-on Helm charts
        run: |
          source scripts/cluster-addons.env
          mkdir -p /tmp/rendered-addons
          helm template calico-crds helm/cluster-addons/calico-crds \
            --namespace tigera-operator --include-crds \
            > /tmp/rendered-addons/calico-crds.yaml
          helm template calico projectcalico/tigera-operator \
            --version "$CALICO_VERSION" --namespace tigera-operator \
            --set 'installation.calicoNetwork.ipPools[0].cidr=192.168.0.0/16' \
            > /tmp/rendered-addons/calico.yaml
          helm template ingress-nginx ingress-nginx/ingress-nginx \
            --version "$INGRESS_NGINX_VERSION" --namespace ingress-nginx \
            --set controller.kind=DaemonSet \
            --set controller.hostPort.enabled=true \
            --set-string controller.nodeSelector.ingress-ready=true \
            --set-json 'controller.tolerations=[{"key":"node-role.kubernetes.io/control-plane","operator":"Exists","effect":"NoSchedule"}]' \
            --set controller.service.type=ClusterIP \
            > /tmp/rendered-addons/ingress-nginx.yaml
          helm template metrics-server metrics-server/metrics-server \
            --version "$METRICS_SERVER_VERSION" --namespace kube-system \
            --set-string 'args[0]=--kubelet-insecure-tls' \
            > /tmp/rendered-addons/metrics-server.yaml
          helm template cert-manager oci://quay.io/jetstack/charts/cert-manager \
            --version "$CERT_MANAGER_VERSION" --namespace cert-manager \
            --set crds.enabled=true \
            > /tmp/rendered-addons/cert-manager.yaml
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.pipeline.outputs.go_version }}
      - name: Install Kubernetes manifest validator
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v${{ steps.pipeline.outputs.kubeconform_version }}
      - name: Validate rendered platform and monitoring resources
        run: kubeconform -strict -ignore-missing-schemas /tmp/rendered-platform/*.yaml /tmp/rendered-monitoring/*.yaml /tmp/rendered-addons/*.yaml
      - name: Scan project platform resources for security misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered-platform
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Scan pinned monitoring chart resources
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered-monitoring
          trivyignores: helm/monitoring/.trivyignore
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Lint Fluentd Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: helm/logging-helm/image/Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build Fluentd image for validation
        uses: docker/build-push-action@v7
        with:
          context: helm/logging-helm/image
          load: true
          tags: local/yotta/${{ steps.pipeline.outputs.fluentd_image_name }}:${{ github.sha }}
      - name: Validate Fluentd image and mounted configuration
        run: |
          docker run --rm \
            -v /tmp/fluent.conf:/fluentd/etc/fluent.conf:ro \
            -v /tmp:/var/log/fluentd \
            local/yotta/${{ steps.pipeline.outputs.fluentd_image_name }}:${{ github.sha }} \
            fluentd --dry-run -c /fluentd/etc/fluent.conf
      - name: Scan Fluentd image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/yotta/${{ steps.pipeline.outputs.fluentd_image_name }}:${{ github.sha }}
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
  publish:
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Calculate unique image version
        id: version
        run: |
          echo "version=$(./scripts/build-version.sh)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.pipeline.outputs.container_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Fluentd image
        uses: docker/build-push-action@v7
        with:
          context: helm/logging-helm/image
          platforms: ${{ steps.pipeline.outputs.image_build_platforms }}
          push: true
          tags: |
            ${{ steps.pipeline.outputs.container_registry }}/${{ steps.version.outputs.owner }}/${{ steps.pipeline.outputs.fluentd_image_name }}:${{ steps.version.outputs.version }}
            ${{ steps.pipeline.outputs.container_registry }}/${{ steps.version.outputs.owner }}/${{ steps.pipeline.outputs.fluentd_image_name }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Show the published Fluentd image tag
        env:
          IMAGE_OWNER: ${{ steps.version.outputs.owner }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: |
          {
            echo '### Deployment image tag'
            echo
            echo "$IMAGE_TAG"
            echo
            echo 'Enter this value in the image_tag field of the Platform Deployment workflow.'
            echo "Full image: $CONTAINER_REGISTRY/$IMAGE_OWNER/$FLUENTD_IMAGE_NAME:$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
