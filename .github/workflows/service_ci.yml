# CI retrigger marker: 2026-11-16 end-to-end check.
name: Service CI
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      image:
        required: true
        type: string
      path:
        description: Folder with the Dockerfile, src and test (default services/<service>)
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: Unique timestamped image version published by this run
        value: ${{ jobs.publish.outputs.version }}
permissions:
  contents: read
  packages: write
concurrency:
  group: service-${{ inputs.service }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.pipeline.outputs.python_version }}
      - name: Install service and validation dependencies
        working-directory: ${{ inputs.path || format('services/{0}', inputs.service) }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff bandit pip-audit httpx httpx2
      - name: Python lint
        working-directory: ${{ inputs.path || format('services/{0}', inputs.service) }}
        run: ruff check src test
      - name: Unit tests
        working-directory: ${{ inputs.path || format('services/{0}', inputs.service) }}
        run: python -m pytest -q
      - name: Static application security scan
        working-directory: ${{ inputs.path || format('services/{0}', inputs.service) }}
        run: bandit -q -r src
      - name: Python dependency vulnerability audit
        working-directory: ${{ inputs.path || format('services/{0}', inputs.service) }}
        run: pip-audit -r requirements.txt --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.path || format('services/{0}', inputs.service) }}/Dockerfile
      - uses: docker/setup-buildx-action@v4
      # Regression guard: build from owner-only files (as on a developer Mac) so the image must
      # make its files readable for the non-root app user itself; the health check below proves it
      - name: Make the build context owner-only
        run: chmod -R go-rwx "${{ inputs.path || format('services/{0}', inputs.service) }}"
      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.path || format('services/{0}', inputs.service) }}
          load: true
          tags: local/${{ inputs.image }}:${{ github.sha }}
      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ inputs.image }}:${{ github.sha }}
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Validate container runtime and health check
        shell: bash
        run: |
          docker network create service-test-network
          trap 'docker logs service-under-test 2>/dev/null || true; docker logs database-under-test 2>/dev/null || true; docker logs kafka-under-test 2>/dev/null || true; docker rm -f service-under-test database-under-test kafka-under-test >/dev/null 2>&1 || true; docker network rm service-test-network >/dev/null 2>&1 || true' EXIT
          docker run -d --name database-under-test --network service-test-network \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci "$POSTGRES_CI_IMAGE"
          docker run -d --name kafka-under-test --network service-test-network \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e "KAFKA_LISTENERS=CONTROLLER://:9093,INTERNAL://:$KAFKA_INTERNAL_PORT" \
            -e "KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-under-test:$KAFKA_INTERNAL_PORT" \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-under-test:9093 \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 "$KAFKA_CI_IMAGE"
          for _ in {1..30}; do
            if docker exec database-under-test pg_isready -U ci -d ci >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec database-under-test pg_isready -U ci -d ci
          for _ in {1..45}; do
            if docker exec kafka-under-test /opt/kafka/bin/kafka-topics.sh --bootstrap-server "localhost:$KAFKA_INTERNAL_PORT" --list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec kafka-under-test /opt/kafka/bin/kafka-topics.sh --bootstrap-server "localhost:$KAFKA_INTERNAL_PORT" --create --if-not-exists --topic website-events --partitions 1 --replication-factor 1
          docker run -d --name service-under-test --network service-test-network \
            -e DATABASE_URL=postgresql://ci:ci@database-under-test:5432/ci \
            -e "KAFKA_BOOTSTRAP_SERVERS=kafka-under-test:$KAFKA_INTERNAL_PORT" \
            local/${{ inputs.image }}:${{ github.sha }}
          for _ in {1..20}; do
            if docker exec service-under-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health/live', timeout=2)"; then exit 0; fi
            sleep 1
          done
          echo 'Container health endpoint did not become ready' >&2
          exit 1
  publish:
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Calculate unique image version
        id: version
        run: |
          echo "version=$(./scripts/build-version.sh)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.pipeline.outputs.container_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.pipeline.outputs.container_registry }}/${{ steps.version.outputs.owner }}/${{ inputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long
            type=raw,value=${{ github.sha }}
            type=raw,value={{sha}}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Publish validated image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.path || format('services/{0}', inputs.service) }}
          platforms: ${{ steps.pipeline.outputs.image_build_platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Show the published image tag
        env:
          IMAGE_NAME: ${{ inputs.image }}
          IMAGE_OWNER: ${{ steps.version.outputs.owner }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: |
          {
            echo '### Deployment image tag'
            echo
            echo "$IMAGE_TAG"
            echo
            echo "Full image: $CONTAINER_REGISTRY/$IMAGE_OWNER/$IMAGE_NAME:$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
