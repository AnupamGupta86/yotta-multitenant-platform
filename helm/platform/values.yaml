observabilityNamespace: observability
images:
  websiteOrchestrator: yotta/website-orchestrator:local
  kafka: apache/kafka:4.4.0
  loki: grafana/loki:3.2.1
  fluentd: yotta/fluentd-loki:local
kafka:
  storage:
    enabled: true
    size: 10Gi
    storageClassName: ""
orchestrator:
  repository: ""
  workflow: website_app_cd.yml
  ref: master
  githubToken: ""
notification:
  webhookUrl: ""
observability:
  loki:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  fluentd:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
