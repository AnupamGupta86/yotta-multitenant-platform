# CI retrigger marker: 2026-11-15.
name: Website Orchestrator Deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact published website-orchestrator image tag from the CI run summary
        type: string
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: local-platform-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    environment: platform-deployment
    permissions:
      actions: write
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - name: Validate the selected image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash .github/scripts/validate-image-tag.sh "$IMAGE_TAG"
      - name: Confirm the local Kind cluster and platform are ready
        run: |
          kind get clusters | grep -qx "$KIND_CLUSTER_NAME"
          helm status "$PLATFORM_RELEASE_NAME" --namespace "$PLATFORM_NAMESPACE"
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$CONTAINER_REGISTRY" --username "$GHCR_USER" --password-stdin
      - name: Normalize image owner for GHCR
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$CONTAINER_REGISTRY/$owner/$WEBSITE_ORCHESTRATOR_IMAGE:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Pull and load the selected website orchestrator image into Kind
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "$KIND_CLUSTER_NAME"
      - name: Upgrade the deployment orchestrator with Helm
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "$GHCR_TOKEN" ]]; then
            echo 'Repository Actions secret GHCR_TOKEN is required.' >&2
            exit 2
          fi
          helm upgrade --install "$PLATFORM_RELEASE_NAME" helm/platform --namespace "$PLATFORM_NAMESPACE" --reuse-values \
            --set-string images.websiteOrchestrator="$IMAGE" \
            --set-string orchestrator.repository="$GHCR_REPOSITORY" \
            --set-string orchestrator.githubToken= \
            --wait --timeout "$SERVICE_HELM_TIMEOUT"
          bash .github/scripts/update-orchestrator-token.sh
