# No-op change to allow workflow-triggering commits.
name: Platform Deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Fluentd image tag published by Platform CI
        type: string
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: local-platform-release
  cancel-in-progress: false
jobs:
  validate-chart:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint and render platform chart
        run: |
          helm lint helm/platform
          helm template platform helm/platform --namespace platform > /tmp/platform.yaml
  deploy:
    needs: validate-chart
    if: needs.validate-chart.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    # Configure required reviewers for this environment in repository settings.
    # GitHub holds this job before any deployment step until approval is granted.
    environment:
      name: platform-deployment
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the selected image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'image_tag must be a valid container image tag.' >&2
            exit 2
          fi
      - name: Confirm the local Kind cluster is ready
        run: |
          kind get clusters | grep -qx yotta-platform
          helm status platform --namespace platform
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Normalize the GHCR image owner
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "FLUENTD_IMAGE=ghcr.io/$owner/fluentd-loki:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Pull and load the Fluentd image into Kind
        run: |
          docker pull "$FLUENTD_IMAGE"
          kind load docker-image "$FLUENTD_IMAGE" --name yotta-platform
      - name: Deploy cluster add-ons through Helm
        run: ./scripts/deploy-cluster-addons.sh
      - name: Read pinned monitoring chart version
        run: echo "PROMETHEUS_CHART_VERSION=$(tr -d '[:space:]' < helm/monitoring/chart-version.txt)" >> "$GITHUB_ENV"
      - name: Add and update monitoring Helm repository
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          helm repo update prometheus-community
      - name: Upgrade platform release through Helm
        run: |
          helm upgrade --install platform helm/platform --namespace platform --create-namespace \
            --reuse-values --set-string images.fluentd="$FLUENTD_IMAGE" \
            --wait --timeout 15m
          kubectl rollout status daemonset/fluentd --namespace observability --timeout=5m
      - name: Upgrade Prometheus and Grafana through Helm
        run: |
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --version "$PROMETHEUS_CHART_VERSION" \
            --namespace observability --create-namespace \
            --values helm/monitoring/values.yaml --wait --timeout 15m
