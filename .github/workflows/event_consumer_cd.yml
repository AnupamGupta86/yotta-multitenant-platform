name: Event Consumer Deployment
on:
  workflow_run:
    workflows: ['Event Consumer CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact published website-event-consumer image tag from the CI run summary
        type: string
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: local-platform-release
  cancel-in-progress: false
jobs:
  deploy-platform:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')))
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Validate the selected image tag
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'image_tag must be a valid container image tag.' >&2
            exit 2
          fi
      - name: Confirm the local Kind cluster and platform are ready
        run: |
          kind get clusters | grep -qx yotta-platform
          helm status platform --namespace platform
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Normalize image owner for GHCR
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/$owner/website-event-consumer:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Pull and load the selected consumer image into Kind
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name yotta-platform
      - name: Upgrade the deployment orchestrator with Helm
        run: |
          helm upgrade --install platform helm/platform --namespace platform --reuse-values \
            --set-string images.eventConsumer="$IMAGE" --wait --timeout 10m
          kubectl rollout status deployment/event-consumer --namespace platform --timeout=5m
