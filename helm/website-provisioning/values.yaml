image:
  repository: yotta/website-provisioning
  tag: local
  pullPolicy: IfNotPresent
postgres:
  image: postgres:16-alpine
  storage:
    enabled: true
    size: 5Gi
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
api:
  replicas: 2
  port: 3000
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
ingress:
  enabled: true
  className: nginx
  host: provisioning.myyotta.com
  clusterIssuer: local-selfsigned
kafka:
  bootstrapServers: kafka.platform.svc.cluster.local:19092
  topic: website-events
