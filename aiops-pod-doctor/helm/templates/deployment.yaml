apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels: {app.kubernetes.io/name: {{ .Values.name }}}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Values.name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Values.name }}}
      annotations:
        aiops/grok-key-revision: {{ .Values.grok.keyRevision | quote }}
    spec:
      serviceAccountName: {{ .Values.name }}
      # The doctor reads pods through the Kubernetes API, so it needs its (read-only) token
      automountServiceAccountToken: true
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: PORT, value: {{ .Values.port | quote }}}
            - {name: POLL_INTERVAL_SECONDS, value: {{ .Values.pollIntervalSeconds | quote }}}
            - {name: WATCH_NAMESPACES, value: {{ .Values.watchNamespaces | quote }}}
            - {name: IGNORE_NAMESPACES, value: {{ .Values.ignoreNamespaces | quote }}}
            - {name: LOG_TAIL_LINES, value: {{ .Values.logTailLines | quote }}}
            - {name: GROK_MODEL, value: {{ .Values.grok.model | quote }}}
            - {name: GROK_API_URL, value: {{ .Values.grok.apiUrl | quote }}}
            - {name: GROK_TIMEOUT_SECONDS, value: {{ .Values.grok.timeoutSeconds | quote }}}
            - name: GROK_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.grok.existingSecret }}, key: api-key, optional: true}
          ports: [{name: http, containerPort: {{ .Values.port }}}]
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels: {app.kubernetes.io/name: {{ .Values.name }}}
spec:
  selector: {app.kubernetes.io/name: {{ .Values.name }}}
  ports: [{name: http, port: 80, targetPort: http}]
