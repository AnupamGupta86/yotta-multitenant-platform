{{- $secretName := "provisioning-db-credentials" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := randAlphaNum 40 -}}
{{- if $existing -}}{{- $password = index $existing.data "password" | b64dec -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
stringData:
  password: {{ $password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: provisioning-postgres
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: provisioning-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: provisioning-postgres
spec:
  serviceName: provisioning-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: provisioning-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: provisioning-postgres}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          env:
            - {name: POSTGRES_DB, value: provisioning}
            - {name: POSTGRES_USER, value: provisioning}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: provisioning-db-credentials, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          startupProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 10
            timeoutSeconds: 3
          resources: {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
{{ $secretName := "database-api-db-credentials" }}
{{ $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{ $password := randAlphaNum 40 }}
{{ if $existing }}{{ $password = index $existing.data "password" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
stringData:
  password: {{ $password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: database-api-postgres
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: database-api-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database-api-postgres
spec:
  serviceName: database-api-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: database-api-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: database-api-postgres}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          env:
            - {name: POSTGRES_DB, value: database_api}
            - {name: POSTGRES_USER, value: database_api}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: database-api-db-credentials, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          startupProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 10
            timeoutSeconds: 3
          resources: {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
