apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.dashboard.configMapName }}
  namespace: {{ .Values.observabilityNamespace }}
  labels:
    {{ .Values.dashboard.labelName }}: {{ .Values.dashboard.labelValue | quote }}
data:
  website-platform.json: |
{{ .Files.Get "files/website-dashboard.json" | indent 4 }}
