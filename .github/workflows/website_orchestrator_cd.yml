# CI retrigger marker: 2026-11-18 21:42 IST end-to-end check.
name: Website Orchestrator Deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact published website-orchestrator image tag from the CI run summary
        type: string
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: local-platform-release
  cancel-in-progress: false
jobs:
  validate-chart:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    # Lint, render and schema-check (kubeconform) the chart with this run's values before anything is reviewed or approved.
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.pipeline.outputs.helm_version }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.pipeline.outputs.go_version }}
      - name: Install Kubernetes manifest validator
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v${{ steps.pipeline.outputs.kubeconform_version }}
      - name: Validate the website-orchestrator chart with the new image
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          bash .github/scripts/validate-chart.sh "$WEBSITE_ORCHESTRATOR_RELEASE_NAME" helm/website-orchestrator-helm \
            --namespace "$PLATFORM_NAMESPACE" \
            --set-string image="$CONTAINER_REGISTRY/$owner/$WEBSITE_ORCHESTRATOR_IMAGE:$IMAGE_TAG" \
            --set-string github.repository="$GITHUB_REPOSITORY"
  review-changes:
    needs: validate-chart
    if: needs.validate-chart.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    # No approval: compares the deployed release with this change (helm diff), so the reviewer reads
    # the diff in this job's log or the run summary before approving the deploy job.
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      HELM_MODE: diff
      GHCR_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - name: Validate the selected image tag
        run: bash .github/scripts/validate-image-tag.sh "$IMAGE_TAG"
      - name: Confirm the local Kind cluster is running
        run: kind get clusters | grep -qx "$KIND_CLUSTER_NAME"
      - name: Choose the image
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$CONTAINER_REGISTRY/$owner/$WEBSITE_ORCHESTRATOR_IMAGE:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: "Changes: website-orchestrator release (deployed vs new)"
        run: .github/scripts/helm-releases.sh orchestrator
      - uses: actions/upload-artifact@v6
        with:
          name: helm-diff-${{ github.run_id }}
          path: ${{ runner.temp }}/helm-diff/
          if-no-files-found: warn
          retention-days: 14
  deploy:
    needs: review-changes
    if: needs.review-changes.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    # Manual approval: this job waits until a reviewer approves the deployment of the website orchestrator.
    # Reviewers are set on the 'website-orchestrator-deployment' environment (scripts/setup-deployment-approvals.sh).
    environment:
      name: website-orchestrator-deployment
    permissions:
      actions: write
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - name: Validate the selected image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash .github/scripts/validate-image-tag.sh "$IMAGE_TAG"
      - name: Confirm the local Kind cluster and platform are ready
        run: |
          kind get clusters | grep -qx "$KIND_CLUSTER_NAME"
          helm status "$KAFKA_RELEASE_NAME" --namespace "$PLATFORM_NAMESPACE" >/dev/null \
            || { echo "::error::The kafka release is not installed yet. Run Platform Deployment first."; exit 1; }
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$CONTAINER_REGISTRY" --username "$GHCR_USER" --password-stdin
      - name: Normalize image owner for GHCR
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$CONTAINER_REGISTRY/$owner/$WEBSITE_ORCHESTRATOR_IMAGE:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Load the selected website orchestrator image into Kind (nodes' platform only)
        run: ./scripts/load-image-into-kind.sh "$IMAGE" "$KIND_CLUSTER_NAME"
      - name: Give the orchestrator the platform database password (optional until the database is deployed)
        run: |
          ./scripts/copy-database-secret.sh "$PLATFORM_NAMESPACE" \
            || echo "::warning::Platform database not deployed yet: the orchestrator runs without recording events. Run Database Deployment, then re-run this workflow."
      - name: Install or upgrade the website-orchestrator release with Helm
        env:
          GHCR_REPOSITORY: ${{ github.repository }}
          # The orchestrator keeps this token to start Website Deployment whenever a website is
          # requested, so it must be a long-lived token. The job's own GITHUB_TOKEN is revoked as soon
          # as this job ends, which would make every later request fail with HTTP 401.
          ORCHESTRATOR_GITHUB_TOKEN: ${{ secrets.ORCHESTRATOR_GITHUB_TOKEN }}
        run: |
          if [[ -z "$ORCHESTRATOR_GITHUB_TOKEN" ]]; then
            echo "::error::Add the repository secret ORCHESTRATOR_GITHUB_TOKEN: a fine-grained token for this repository with 'Actions: Read and write' (see docs/deployment.md)."
            exit 2
          fi
          .github/scripts/helm-releases.sh orchestrator
          bash .github/scripts/update-orchestrator-token.sh
