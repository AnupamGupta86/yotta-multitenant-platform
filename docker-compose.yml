# Local run without Kubernetes. The database is the same image Kubernetes runs (services/database:
# PostgreSQL 16 + schema 001-008); the provisioning API and the orchestrator use it like in the cluster.
services:
  postgres:
    build: ./services/database
    environment:
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U myyotta_app -d myyotta_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
  hosting-platform:
    build: ./services/hosting-platform
    environment:
      DB_HOST: postgres
      DB_NAME: myyotta_platform
      DB_USER: myyotta_app
      DB_PASSWORD: local-demo-only
      HOST: 0.0.0.0
      PORT: 3000
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: website-events
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - kafka-data:/var/lib/kafka/data
  website-orchestrator:
    build: ./services/website-orchestrator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: website-events
      GH_REPOSITORY: ${ORCHESTRATOR_REPOSITORY:-}
      GH_WORKFLOW_NAME: website_cd.yml
      GH_TEARDOWN_WORKFLOW_NAME: website_teardown.yml
      GH_REF: master
      GH_TOKEN: ${ORCHESTRATOR_GITHUB_TOKEN:-}
      ORCHESTRATOR_DRY_RUN: ${ORCHESTRATOR_DRY_RUN:-true}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      DB_HOST: postgres
      DB_NAME: myyotta_platform
      DB_USER: myyotta_app
      DB_PASSWORD: local-demo-only
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  kafka-data:
  postgres-data:
