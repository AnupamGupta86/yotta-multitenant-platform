tenant:
  name: user1
image:
  repository: ghcr.io/owner/website-app
  tag: latest
  pullPolicy: IfNotPresent
replicaCount: 2
containerPort: 3000
revisionHistoryLimit: 5
metrics:
  enabled: true
  path: /metrics
ingress:
  enabled: true
  className: nginx
  host: user1.localtest.me
  clusterIssuer: local-selfsigned
  path: /
  pathType: Prefix
  tlsSecretSuffix: tls
service:
  type: ClusterIP
  port: 80
  targetPortName: http
probes:
  startup:
    path: /health/live
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60
  liveness:
    path: /health/live
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  cpuUtilization: 60
  memoryUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
quota:
  requestsCpu: "4"
  requestsMemory: 4Gi
  # Allow the eight HPA replicas plus the tenant PostgreSQL pod (1 CPU each).
  limitsCpu: "10"
  limitsMemory: 8Gi
  pods: "20"
serviceMonitor:
  enabled: true
  release: prometheus
  path: /metrics
  interval: 15s
pdb:
  minAvailable: 1
limitRange:
  enabled: true
  defaultRequest: {cpu: 100m, memory: 128Mi}
  default: {cpu: 500m, memory: 512Mi}
  max: {cpu: "2", memory: 1Gi}
  min: {cpu: 50m, memory: 64Mi}
networkPolicy:
  enabled: true
  appPolicyName: website-app
  databasePolicyName: tenant-postgres
  ingressNamespaces:
    - ingress-nginx
    - observability
  dnsNamespace: kube-system
  dnsPodLabel: k8s-app
  dnsPodLabelValue: kube-dns
  dnsUdpPort: 53
  dnsTcpPort: 53
database:
  enabled: true
  secretName: tenant-db-credentials
  secretLength: 48
  user: website
  name: website
  image: postgres:16-alpine
  replicas: 1
  port: 5432
  mountPath: /var/lib/postgresql/data
  pgdata: /var/lib/postgresql/data/pgdata
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  startupProbe:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30
  readinessProbe:
    periodSeconds: 5
    timeoutSeconds: 3
  livenessProbe:
    periodSeconds: 10
    timeoutSeconds: 3
  storage:
    enabled: true
    size: 5Gi
    storageClassName: ""
eventPublisher:
  enabled: false
  image: yotta/website-orchestrator:local
  imagePullPolicy: IfNotPresent
  bootstrapServers: kafka.platform.svc.cluster.local:19092
  eventType: WebsiteCreated
  correlationId: ""
  backoffLimit: 3
  activeDeadlineSeconds: 120
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
