# The UIs are served through the existing ingress-nginx on the Kind HTTPS port (8443, bound to 127.0.0.1 only),
# so nothing new is opened on the Mac. Add the three hostnames to /etc/hosts (see docs/deployment.md).
grafana:
  adminUser: admin
  adminPassword: local-demo-only-change-me
  rbac:
    namespaced: true
  sidecar:
    resources:
      requests: {cpu: 10m, memory: 48Mi}
      limits: {cpu: 100m, memory: 128Mi}
    dashboards:
      searchNamespace: observability
    datasources:
      searchNamespace: observability
  persistence:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
  grafana.ini:
    server:
      root_url: https://grafana.myyotta.com:8443
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: local-selfsigned
    hosts: [grafana.myyotta.com]
    path: /
    tls:
      - secretName: grafana-tls
        hosts: [grafana.myyotta.com]
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      isDefault: false
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: local-selfsigned
    hosts: [prometheus.myyotta.com]
    paths: [/]
    pathType: Prefix
    tls:
      - secretName: prometheus-tls
        hosts: [prometheus.myyotta.com]
  prometheusSpec:
    externalUrl: https://prometheus.myyotta.com:8443
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: prometheus
    retention: 3d
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  # ingress-nginx request metrics (every HTTP service behind the Ingress, by status): 4XX / 5XX per service.
  # honorLabels keeps the metric's own namespace label (the Ingress's namespace), so the dashboard's
  # Namespace filter works; without it Prometheus would rename it to exported_namespace.
  additionalServiceMonitors:
    - name: ingress-nginx
      selector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller
      namespaceSelector:
        matchNames: [infrastructure]
      endpoints:
        - port: metrics
          interval: 30s
          honorLabels: true
alertmanager:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: local-selfsigned
    hosts: [alertmanager.myyotta.com]
    paths: [/]
    pathType: Prefix
    tls:
      - secretName: alertmanager-tls
        hosts: [alertmanager.myyotta.com]
  alertmanagerSpec:
    externalUrl: https://alertmanager.myyotta.com:8443
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
prometheusOperator:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 192Mi}
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}
  collectors:
    - certificatesigningrequests
    - configmaps
    - cronjobs
    - daemonsets
    - deployments
    - endpointslices
    - horizontalpodautoscalers
    - ingresses
    - jobs
    - leases
    - limitranges
    - mutatingwebhookconfigurations
    - namespaces
    - networkpolicies
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - poddisruptionbudgets
    - pods
    - replicasets
    - replicationcontrollers
    - resourcequotas
    - services
    - statefulsets
    - storageclasses
    - validatingwebhookconfigurations
    - volumeattachments
prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi}
  hostNetwork: false
  hostPID: false
