# Dashboards as ConfigMaps; Grafana's sidecar loads every ConfigMap with this label.
# Release: grafana-dashboards, namespace: observability. Installed right after the prometheus release (Platform Deployment).
# files/website-dashboard.json is generated by scripts/generate-dashboard.py.
configMapName: website-platform-dashboard
sidecarLabel:
  name: grafana_dashboard
  value: "1"
