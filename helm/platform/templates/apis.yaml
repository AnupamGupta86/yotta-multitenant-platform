apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-api
  labels: {app.kubernetes.io/name: database-api}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: database-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: database-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: database-api
          image: {{ .Values.images.databaseApi | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: PORT, value: {{ .Values.api.port | quote }}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: database-api-db-credentials, key: password}}
            - name: DATABASE_URL
              value: postgresql://database_api:$(DB_PASSWORD)@database-api-postgres:5432/database_api
          ports: [{name: http, containerPort: {{ .Values.api.port }}}]
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: database-api
  labels: {app.kubernetes.io/name: database-api}
spec:
  selector: {app.kubernetes.io/name: database-api}
  ports: [{name: http, port: 80, targetPort: http}]
