# CI retrigger marker: 2026-11-16 19:30 IST end-to-end check.
name: Website Provisioning Deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published website-provisioning image tag to deploy
        type: string
        required: true
permissions:
  contents: read
  packages: read
jobs:
  validate-chart:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    # Lint, render and schema-check (kubeconform) the chart with this run's values before anything is reviewed or approved.
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.pipeline.outputs.helm_version }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.pipeline.outputs.go_version }}
      - name: Install Kubernetes manifest validator
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v${{ steps.pipeline.outputs.kubeconform_version }}
      - name: Validate the provisioning chart
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          bash .github/scripts/validate-chart.sh "$WEBSITE_PROVISIONING_IMAGE" helm/website-provisioning --namespace "$PLATFORM_NAMESPACE" \
            --set-string image.repository="$CONTAINER_REGISTRY/$owner/$WEBSITE_PROVISIONING_IMAGE" --set-string image.tag="$IMAGE_TAG"
  review-changes:
    needs: validate-chart
    if: needs.validate-chart.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    # No approval: compares the deployed release with this change (helm diff), so the reviewer reads
    # the diff in this job's log or the run summary before approving the deploy job.
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      HELM_MODE: diff
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - name: Validate the selected image tag
        run: bash .github/scripts/validate-image-tag.sh "$IMAGE_TAG"
      - name: Confirm the local Kind cluster is running
        run: kind get clusters | grep -qx "$KIND_CLUSTER_NAME"
      - name: Choose the image
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$CONTAINER_REGISTRY/$owner/$$WEBSITE_PROVISIONING_IMAGE:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: "Changes: website-provisioning release (deployed vs new)"
        run: .github/scripts/helm-releases.sh provisioning
      - uses: actions/upload-artifact@v6
        with:
          name: helm-diff-${{ github.run_id }}
          path: ${{ runner.temp }}/helm-diff/
          if-no-files-found: warn
          retention-days: 14
  deploy:
    needs: review-changes
    if: needs.review-changes.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    # Manual approval: this job waits until a reviewer approves the deployment of the website provisioning service.
    # Reviewers are set on the 'website-provisioning-deployment' environment (scripts/setup-deployment-approvals.sh).
    environment:
      name: website-provisioning-deployment
    timeout-minutes: 30
    concurrency:
      group: local-platform-release
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - name: Validate the selected image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash .github/scripts/validate-image-tag.sh "$IMAGE_TAG"
      - name: Confirm the local Kind cluster and platform are ready
        run: |
          kind get clusters | grep -qx "$KIND_CLUSTER_NAME"
          helm status "$PLATFORM_RELEASE_NAME" --namespace "$PLATFORM_NAMESPACE" >/dev/null \
            || { echo "::error::The platform release is not installed yet (Kafka, orchestrator). Run Platform Deployment first."; exit 1; }
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$CONTAINER_REGISTRY" --username "$GHCR_USER" --password-stdin
      - name: Normalize image owner for GHCR
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$CONTAINER_REGISTRY/$owner/$WEBSITE_PROVISIONING_IMAGE:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Load the selected app image into Kind (nodes' platform only)
        run: ./scripts/load-image-into-kind.sh "$IMAGE" "$KIND_CLUSTER_NAME"
      - name: Install or upgrade the Day 0 release through Helm
        run: |
          .github/scripts/helm-releases.sh provisioning
          kubectl rollout status deployment/"$WEBSITE_PROVISIONING_DEPLOYMENT" --namespace "$PLATFORM_NAMESPACE" --timeout="$ROLLOUT_TIMEOUT"
