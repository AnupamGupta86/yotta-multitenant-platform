{{- if .Values.database.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: tenant-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: {{ .Values.database.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.database.image | quote }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: password
            - name: PGDATA
              value: {{ .Values.database.pgdata | quote }}
          ports:
            - name: postgres
              containerPort: {{ .Values.database.port }}
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: {{ .Values.database.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.database.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.database.startupProbe.failureThreshold }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            timeoutSeconds: {{ .Values.database.readinessProbe.timeoutSeconds }}
            periodSeconds: {{ .Values.database.readinessProbe.periodSeconds }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            timeoutSeconds: {{ .Values.database.livenessProbe.timeoutSeconds }}
            periodSeconds: {{ .Values.database.livenessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.database.mountPath | quote }}
            - name: tmp
              mountPath: /tmp
            - name: postgres-run
              mountPath: /var/run/postgresql
      volumes:
        {{- if not .Values.database.storage.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}
  {{- if .Values.database.storage.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.database.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage.size | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tenant-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
{{- end }}
