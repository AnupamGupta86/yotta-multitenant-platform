apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.kafka.headlessServiceName }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: {{ .Values.kafka.name }}}
  ports:
    - {name: controller, port: {{ .Values.kafka.ports.controller }}, targetPort: controller}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.kafka.name }}
spec:
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: {{ .Values.kafka.name }}}
  ports:
    - {name: internal, port: {{ .Values.kafka.ports.internal }}, targetPort: internal}
    - {name: external, port: {{ .Values.kafka.ports.external }}, targetPort: external}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.kafka.name }}
spec:
  serviceName: {{ .Values.kafka.headlessServiceName }}
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Values.kafka.name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Values.kafka.name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-kafka-config
          image: {{ .Values.images.kafka | quote }}
          command: [sh, -ec, "cp -r /opt/kafka/config/. /config/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: kafka-config, mountPath: /config}
      containers:
        - name: kafka
          image: {{ .Values.images.kafka | quote }}
          ports:
            - {name: controller, containerPort: {{ .Values.kafka.ports.controller }}}
            - {name: internal, containerPort: {{ .Values.kafka.ports.internal }}}
            - {name: external, containerPort: {{ .Values.kafka.ports.external }}}
          env:
            - {name: KAFKA_NODE_ID, value: {{ .Values.kafka.nodeId | quote }}}
            - {name: KAFKA_PROCESS_ROLES, value: {{ .Values.kafka.processRoles | quote }}}
            - {name: KAFKA_LOG_DIRS, value: {{ .Values.kafka.storage.mountPath | quote }}}
            - name: KAFKA_LISTENERS
              value: {{ printf "%s://:%v,%s://:%v,%s://:%v" .Values.kafka.listeners.controller .Values.kafka.ports.controller .Values.kafka.listeners.internal .Values.kafka.ports.internal .Values.kafka.listeners.external .Values.kafka.ports.external | quote }}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: {{ printf "%s://%s.%s.svc.cluster.local:%v,%s://%s:%v" .Values.kafka.listeners.internal .Values.kafka.name .Release.Namespace .Values.kafka.ports.internal .Values.kafka.listeners.external .Values.kafka.listeners.externalAdvertisedHost .Values.kafka.listeners.externalAdvertisedPort | quote }}
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: {{ printf "%s:%s,%s:%s,%s:%s" .Values.kafka.listeners.controller .Values.kafka.listeners.securityProtocol .Values.kafka.listeners.internal .Values.kafka.listeners.securityProtocol .Values.kafka.listeners.external .Values.kafka.listeners.securityProtocol | quote }}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: {{ .Values.kafka.listeners.controller | quote }}}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: {{ printf "%v@%s-0.%s.%s.svc.cluster.local:%v" .Values.kafka.nodeId .Values.kafka.name .Values.kafka.headlessServiceName .Release.Namespace .Values.kafka.ports.controller | quote }}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: {{ .Values.kafka.listeners.internal | quote }}}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: {{ .Values.kafka.offsetsReplicationFactor | quote }}}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: {{ .Values.kafka.transactionReplicationFactor | quote }}}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: {{ .Values.kafka.transactionMinIsr | quote }}}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: {{ .Values.kafka.groupInitialRebalanceDelayMs | quote }}}
            - {name: KAFKA_NUM_PARTITIONS, value: {{ .Values.kafka.numPartitions | quote }}}
            - {name: KAFKA_HEAP_OPTS, value: {{ .Values.kafka.heapOpts | quote }}}
          readinessProbe:
            exec:
              command: [sh, -c, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:{{ .Values.kafka.ports.internal }} --list >/dev/null 2>&1"]
            initialDelaySeconds: {{ .Values.kafka.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.kafka.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.kafka.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.kafka.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: kafka-config, mountPath: /opt/kafka/config}
            - {name: kafka-logs, mountPath: /opt/kafka/logs}
            - {name: {{ .Values.kafka.storage.volumeName }}, mountPath: {{ .Values.kafka.storage.mountPath | quote }}}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: kafka-config, emptyDir: {}}
        - {name: kafka-logs, emptyDir: {}}
        {{- if not .Values.kafka.storage.enabled }}
        - {name: {{ .Values.kafka.storage.volumeName }}, emptyDir: {}}
        {{- end }}
        - {name: tmp, emptyDir: {}}
  {{- if .Values.kafka.storage.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.kafka.storage.volumeName }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.kafka.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage.size | quote }}
  {{- end }}
