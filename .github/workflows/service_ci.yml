# No-op change to allow workflow-triggering commits.
name: Service CI
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      image:
        required: true
        type: string
    outputs:
      version:
        description: Unique timestamped image version published by this run
        value: ${{ jobs.publish.outputs.version }}
permissions:
  contents: read
  packages: write
  security-events: write
concurrency:
  group: service-${{ inputs.service }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install service and validation dependencies
        working-directory: services/${{ inputs.service }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff bandit pip-audit httpx httpx2
      - name: Python lint
        working-directory: services/${{ inputs.service }}
        run: ruff check src test
      - name: Unit tests
        working-directory: services/${{ inputs.service }}
        run: python -m pytest -q
      - name: Static application security scan
        working-directory: services/${{ inputs.service }}
        run: bandit -q -r src
      - name: Python dependency vulnerability audit
        working-directory: services/${{ inputs.service }}
        run: pip-audit -r requirements.txt --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/${{ inputs.service }}/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          load: true
          tags: local/${{ inputs.image }}:${{ github.sha }}
      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ inputs.image }}:${{ github.sha }}
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Validate container runtime and health check
        shell: bash
        run: |
          docker network create service-test-network
          trap 'docker logs service-under-test 2>/dev/null || true; docker logs database-under-test 2>/dev/null || true; docker logs kafka-under-test 2>/dev/null || true; docker rm -f service-under-test database-under-test kafka-under-test >/dev/null 2>&1 || true; docker network rm service-test-network >/dev/null 2>&1 || true' EXIT
          docker run -d --name database-under-test --network service-test-network \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci postgres:16-alpine
          docker run -d --name kafka-under-test --network service-test-network \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=CONTROLLER://:9093,INTERNAL://:19092 \
            -e KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-under-test:19092 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-under-test:9093 \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 apache/kafka:4.4.0
          for _ in {1..30}; do
            if docker exec database-under-test pg_isready -U ci -d ci >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec database-under-test pg_isready -U ci -d ci
          for _ in {1..45}; do
            if docker exec kafka-under-test /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec kafka-under-test /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --create --if-not-exists --topic website-events --partitions 1 --replication-factor 1
          docker run -d --name service-under-test --network service-test-network \
            -e DATABASE_URL=postgresql://ci:ci@database-under-test:5432/ci \
            -e KAFKA_BOOTSTRAP_SERVERS=kafka-under-test:19092 \
            local/${{ inputs.image }}:${{ github.sha }}
          for _ in {1..20}; do
            if docker exec service-under-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health/live', timeout=2)"; then exit 0; fi
            sleep 1
          done
          echo 'Container health endpoint did not become ready' >&2
          exit 1
  publish:
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Calculate unique image version
        id: version
        run: |
          echo "version=$(./scripts/build-version.sh)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.version.outputs.owner }}/${{ inputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long
            type=raw,value=${{ github.sha }}
            type=raw,value={{sha}}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Publish validated image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
