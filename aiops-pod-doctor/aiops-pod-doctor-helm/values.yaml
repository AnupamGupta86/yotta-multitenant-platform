name: aiops-pod-doctor
image:
  repository: yotta/aiops-pod-doctor
  tag: local
  pullPolicy: IfNotPresent

# Which pods are checked
watchNamespaces: ""         # comma separated; empty = every namespace
ignoreNamespaces: ""        # comma separated namespaces to skip
logTailLines: 100           # log lines sent to Grok per container run

grok:
  model: grok-4
  apiUrl: https://api.x.ai/v1/chat/completions
  timeoutSeconds: 60
  # Kubernetes Secret holding the API key under the key "api-key". It is mounted as a file at
  # /etc/aiops/grok/api-key and the app reads the key from there. The CD pipeline creates the Secret
  # from the GROK_API_KEY secret of the 'aiops-deployment' GitHub environment.
  # Without it the doctor still runs and answers with built-in rules.
  existingSecret: aiops-grok-api-key

# E-mail reports (sent by the CronJob)
email:
  smtpHost: smtp.gmail.com
  smtpPort: 587             # 587 = STARTTLS, 465 = implicit TLS
  from: ""                  # empty = the SMTP username
  # Kubernetes Secret with keys "username", "password" and "to" (comma separated recipients),
  # mounted at /etc/aiops/smtp. Created by the CD pipeline from the 'aiops-deployment' environment
  # secrets SMTP_USERNAME, SMTP_PASSWORD and NOTIFY_EMAIL_TO. Without it reports are only logged.
  existingSecret: aiops-smtp

# The doctor: a CronJob that runs every minute, does the RCA for ONE newly failing pod and e-mails the report
cronjob:
  enabled: true
  schedule: "*/30 * * * *"
  # Remembers which failures were already e-mailed (one e-mail per failure, not one per run)
  stateConfigMap: aiops-pod-doctor-state
  # concurrencyPolicy Forbid: if a run is still busy (e.g. waiting for Grok), the next minute is skipped
  activeDeadlineSeconds: 240
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

resources:
  requests: {cpu: 25m, memory: 48Mi}
  limits: {cpu: 250m, memory: 128Mi}
