# Logs: Fluentd (DaemonSet, every node) -> Loki. Release: logging, namespace: observability (next to Grafana).
# Deployed by Platform Deployment (platform_cd.yml); the Fluentd image is built and published by Platform CI.
images:
  loki: grafana/loki:3.2.1
  fluentd: yotta/fluentd-loki:local   # CD sets the GHCR image and tag
loki:
  replicas: 1
  name: loki
  configMapName: loki-config
  configFilePath: /etc/loki/config.yaml
  dataPath: /loki
  configVolumeName: loki-config
  dataVolumeName: loki-data
  temporaryVolumeName: loki-tmp
  imagePullPolicy: IfNotPresent
  storage:
    enabled: false
    claimName: loki-data
    size: 10Gi
    storageClassName: ""
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
  readinessProbe:
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
fluentd:
  serviceAccountName: fluentd
  configMapName: fluentd-config
  daemonSetName: fluentd
  imagePullPolicy: IfNotPresent
  tmpDirectory: /tmp/fluentd
  bufferDirectory: /var/log/fluentd
  containerLogsPath: /var/log/containers/*.log
  positionFile: /var/log/fluentd/containers.pos
  readFromHead: true
  logLevel: info
  lokiUrl: http://loki.observability.svc.cluster.local:3100
  clusterLabel: yotta-local
  jobLabel: kubernetes
  flushInterval: 5s
  flushAtShutdown: true
  bufferChunkLimit: 2m
  bufferQueueLimit: 32
  hostPaths:
    containers: /var/log/containers
    pods: /var/log/pods
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
