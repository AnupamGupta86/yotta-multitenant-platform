name: Database CI
# Validates the platform database (services/database + helm/database-helm), proves the schema in a real
# PostgreSQL 16 container, scans it, and publishes the image for Database Deployment.
on:
  push:
    branches: [master, feature, 'feature/**']
    paths:
      - 'services/database/**'
      - 'helm/database-helm/**'
      - 'scripts/build-version.sh'
      - 'VERSION'
      - '.trivyignore'
      - '.github/workflows/database_ci.yml'
      - '.github/workflows/database_cd.yml'
      - '.github/pipeline-config.env'
      - '.github/scripts/**'
  pull_request:
    branches: [master, feature, 'feature/**']
    paths:
      - 'services/database/**'
      - 'helm/database-helm/**'
      - 'scripts/build-version.sh'
      - 'VERSION'
      - '.trivyignore'
      - '.github/workflows/database_ci.yml'
      - '.github/workflows/database_cd.yml'
      - '.github/pipeline-config.env'
      - '.github/scripts/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: (github.event_name == 'pull_request' && (github.head_ref == 'master' || github.head_ref == 'feature' || startsWith(github.head_ref, 'feature/'))) || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_IMAGE: local/yotta/myyotta-postgresql:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - name: Check the init scripts are numbered and ordered (001 ... 008)
        run: |
          ls services/database/init/*.sql
          expected="001 002 003 004 005 006 007 008"
          actual="$(ls services/database/init/*.sql | xargs -n1 basename | cut -c1-3 | tr '\n' ' ' | sed 's/ $//')"
          [ "$actual" = "$expected" ] || { echo "::error::init scripts must be 001_ ... 008_ in order (found: $actual)"; exit 1; }
      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.pipeline.outputs.helm_version }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.pipeline.outputs.go_version }}
      - name: Install Kubernetes manifest validator
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v${{ steps.pipeline.outputs.kubeconform_version }}
      - name: Validate the database chart (lint, render, kubeconform)
        env:
          RENDER_DIR: /tmp/rendered-database
        run: |
          bash .github/scripts/validate-chart.sh "$DATABASE_RELEASE_NAME" helm/database-helm --namespace "$DATABASE_NAMESPACE" \
            --set-string database.name="$DATABASE_NAME" --set-string database.user="$DATABASE_USER" \
            --set-string service.name="$DATABASE_SERVICE_NAME" --set-string secret.name="$DATABASE_SECRET"
      - name: Scan the rendered chart for security misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered-database
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Lint the database Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/database/Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build the database image for validation
        uses: docker/build-push-action@v7
        with:
          context: services/database
          load: true
          tags: ${{ env.TEST_IMAGE }}
      - name: Start the image and wait until PostgreSQL (and the init scripts) are ready
        run: |
          docker run -d --name ci-postgres -e POSTGRES_PASSWORD=ci-only-not-secret "$TEST_IMAGE"
          for _ in $(seq 1 60); do
            # init scripts run against a temporary server first; wait for the final one on the TCP port
            if docker exec ci-postgres pg_isready -h 127.0.0.1 -U "$DATABASE_USER" -d "$DATABASE_NAME" >/dev/null 2>&1; then
              docker logs ci-postgres 2>&1 | grep -E "running /docker-entrypoint-initdb.d|database system is ready" | tail -12
              exit 0
            fi
            sleep 2
          done
          docker logs ci-postgres
          echo "::error::PostgreSQL did not become ready"
          exit 1
      - name: Run the schema test (tables, keys, unique, CHECK, ON DELETE, triggers)
        run: |
          docker exec -i -e PGPASSWORD=ci-only-not-secret ci-postgres psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U "$DATABASE_USER" -d "$DATABASE_NAME" \
            < services/database/test/schema_test.sql
          docker exec -e PGPASSWORD=ci-only-not-secret ci-postgres psql -h 127.0.0.1 -U "$DATABASE_USER" -d "$DATABASE_NAME" -c '\dt' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Stop the test container
        if: always()
        run: docker rm -f ci-postgres >/dev/null 2>&1 || true
      - name: Scan the database image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
  publish:
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Calculate unique image version
        id: version
        run: |
          echo "version=$(./scripts/build-version.sh)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.pipeline.outputs.container_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the database image
        uses: docker/build-push-action@v7
        with:
          context: services/database
          platforms: ${{ steps.pipeline.outputs.image_build_platforms }}
          push: true
          tags: |
            ${{ steps.pipeline.outputs.container_registry }}/${{ steps.version.outputs.owner }}/${{ steps.pipeline.outputs.database_image }}:${{ steps.version.outputs.version }}
            ${{ steps.pipeline.outputs.container_registry }}/${{ steps.version.outputs.owner }}/${{ steps.pipeline.outputs.database_image }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Show the published database image tag
        env:
          IMAGE_OWNER: ${{ steps.version.outputs.owner }}
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: |
          {
            echo '### Deployment image tag'
            echo
            echo "$IMAGE_TAG"
            echo
            echo 'Enter this value in the image_tag field of the Database Deployment workflow.'
            echo "Full image: $CONTAINER_REGISTRY/$IMAGE_OWNER/$DATABASE_IMAGE:$IMAGE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
