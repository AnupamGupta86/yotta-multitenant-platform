{{- $secretName := .Values.postgres.secretName -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := randAlphaNum (int .Values.postgres.secretLength) -}}
{{- if $existing -}}{{- $password = index $existing.data "password" | b64dec -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  annotations:
    # Survives helm uninstall, so a reinstall reuses the password of the data already on the volume
    helm.sh/resource-policy: keep
  name: {{ $secretName }}
type: Opaque
stringData:
  password: {{ $password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.postgresName }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: {{ .Values.service.postgresName }}}
  ports:
    - {name: postgres, port: {{ .Values.postgres.port }}, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.service.postgresName }}
spec:
  serviceName: {{ .Values.service.postgresName }}
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Values.service.postgresName }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Values.service.postgresName }}}
    spec:
      securityContext:
        fsGroup: 70
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.secretName }}, key: password}}
            - {name: PGDATA, value: {{ .Values.postgres.pgdata | quote }}}
          ports: [{name: postgres, containerPort: {{ .Values.postgres.port }}}]
          startupProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: {{ .Values.postgres.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgres.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.postgres.startupProbe.failureThreshold }}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: {{ .Values.postgres.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgres.readinessProbe.timeoutSeconds }}
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: {{ .Values.postgres.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.postgres.livenessProbe.timeoutSeconds }}
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: {{ .Values.postgres.mountPath | quote }}}
            - {name: tmp, mountPath: /tmp}
            - {name: postgres-run, mountPath: /var/run/postgresql}
      volumes:
        - name: data
          {{- if .Values.postgres.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.postgres.storage.claimName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}
{{- if .Values.postgres.storage.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.postgres.storage.claimName }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.postgres.storage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage.size | quote }}
{{- end }}
