{{- if .Values.eventPublisher.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-publish-website-deployed
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.eventPublisher.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.eventPublisher.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website-event-publisher
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: publish-event
          image: {{ .Values.eventPublisher.image | quote }}
          imagePullPolicy: {{ .Values.eventPublisher.imagePullPolicy }}
          command: [python, /app/publish_event.py]
          args:
            - --tenant
            - {{ .Values.tenant.name | quote }}
            - --domain
            - {{ .Values.ingress.host | quote }}
            - --image
            - {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
            - --event-type
            - {{ .Values.eventPublisher.eventType | quote }}
            - --correlation-id
            - {{ .Values.eventPublisher.correlationId | quote }}
            - --bootstrap-servers
            - {{ .Values.eventPublisher.bootstrapServers | quote }}
          resources:
            {{- toYaml .Values.eventPublisher.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
{{- end }}
