name: Website Provisioning Deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published website-provisioning image tag to deploy
        type: string
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: local-platform-release
  cancel-in-progress: false
jobs:
  validate-chart:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint and render the provisioning chart
        run: |
          helm lint helm/website-provisioning
          helm template website-provisioning helm/website-provisioning --namespace platform > /tmp/website-provisioning.yaml
  deploy-day0:
    needs: validate-chart
    if: needs.validate-chart.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: [self-hosted, macOS, yotta-local-k8s]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/website-provisioning:${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the selected image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'image_tag must be a valid container image tag.' >&2
            exit 2
          fi
      - name: Confirm the local Kind cluster and platform are ready
        run: |
          kind get clusters | grep -qx yotta-platform
          helm status platform --namespace platform
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Pull and load the selected API image
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name yotta-platform
      - name: Install or upgrade the Day 0 release through Helm
        run: |
          helm upgrade --install website-provisioning helm/website-provisioning \
            --namespace platform \
            --set-string image.repository="${IMAGE%:*}" \
            --set-string image.tag="${IMAGE##*:}" \
            --wait --timeout 10m
          kubectl rollout status deployment/website-provisioning --namespace platform --timeout=5m
