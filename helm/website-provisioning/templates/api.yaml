apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-provisioning
  labels: {app.kubernetes.io/name: website-provisioning}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: website-provisioning}
  template:
    metadata:
      labels: {app.kubernetes.io/name: website-provisioning}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: website-provisioning
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: PORT, value: {{ .Values.api.port | quote }}}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: provisioning-db-credentials, key: password}}
            - name: DATABASE_URL
              value: postgresql://provisioning:$(DB_PASSWORD)@provisioning-postgres:5432/provisioning
          ports: [{name: http, containerPort: {{ .Values.api.port }}}]
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: website-provisioning
  labels: {app.kubernetes.io/name: website-provisioning}
spec:
  selector: {app.kubernetes.io/name: website-provisioning}
  ports: [{name: http, port: 80, targetPort: http}]
