apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-website
  labels:
    app.kubernetes.io/name: website
    app.kubernetes.io/instance: {{ .Release.Name }}
    tenant: {{ .Values.tenant.name | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: website
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website
        app.kubernetes.io/instance: {{ .Release.Name }}
        tenant: {{ .Values.tenant.name | quote }}
        myyotta.io/database-client: "true"   # allowed through the platform database's NetworkPolicy
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        prometheus.io/port: "{{ .Values.containerPort }}"
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: website
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ .Values.service.targetPortName }}
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.service.targetPortName }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          env:
            - name: PORT
              value: "{{ .Values.containerPort }}"
            - name: TENANT_NAME
              value: {{ .Values.tenant.name | quote }}
            # Platform database (myyotta_platform in platform-data). The password Secret is copied into the
            # tenant namespace by scripts/copy-database-secret.sh (deploy-tenant.sh does it).
            - {name: DB_HOST, value: {{ .Values.platformDatabase.host | quote }}}
            - {name: DB_PORT, value: {{ .Values.platformDatabase.port | quote }}}
            - {name: DB_NAME, value: {{ .Values.platformDatabase.name | quote }}}
            - {name: DB_USER, value: {{ .Values.platformDatabase.user | quote }}}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformDatabase.secretName }}
                  key: {{ .Values.platformDatabase.secretKey }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.targetPortName }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.targetPortName }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
