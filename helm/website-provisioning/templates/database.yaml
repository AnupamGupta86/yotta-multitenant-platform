{{- $secretName := "provisioning-db-credentials" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := randAlphaNum 40 -}}
{{- if $existing -}}{{- $password = index $existing.data "password" | b64dec -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
stringData:
  password: {{ $password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: website-provisioning-postgres
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: website-provisioning-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: website-provisioning-postgres
spec:
  serviceName: website-provisioning-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: website-provisioning-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: website-provisioning-postgres}
    spec:
      securityContext:
        fsGroup: 70
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          env:
            - {name: POSTGRES_DB, value: provisioning}
            - {name: POSTGRES_USER, value: provisioning}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: provisioning-db-credentials, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          startupProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 10
            timeoutSeconds: 3
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tmp, mountPath: /tmp}
            - {name: postgres-run, mountPath: /var/run/postgresql}
      volumes:
        - name: data
          {{- if .Values.postgres.storage.enabled }}
          persistentVolumeClaim:
            claimName: provisioning-postgres
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}
{{- if .Values.postgres.storage.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: provisioning-postgres
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage.size | quote }}
{{- end }}
