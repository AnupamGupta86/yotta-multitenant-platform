# CI retrigger marker: 2026-11-18 21:42 IST end-to-end check.
name: Website CI
on:
  push:
    branches: [master, feature, 'feature/**']
    paths:
      - 'services/website/**'
      - 'VERSION'
      - 'scripts/build-version.sh'
      - '.trivyignore'
      - 'helm/website-helm/**'
      - '.github/workflows/website_ci.yml'
      - '.github/workflows/website_cd.yml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/pipeline-config.env'
      - '.github/scripts/**'
  pull_request:
    branches: [master, feature, 'feature/**']
    paths:
      - 'services/website/**'
      - 'VERSION'
      - 'scripts/build-version.sh'
      - '.trivyignore'
      - 'helm/website-helm/**'
      - '.github/workflows/website_ci.yml'
      - '.github/workflows/website_cd.yml'
      - '.github/workflows/reusable-service-ci.yml'
      - '.github/pipeline-config.env'
      - '.github/scripts/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  chart-validation:
    if: (github.event_name == 'pull_request' && (github.head_ref == 'master' || github.head_ref == 'feature' || startsWith(github.head_ref, 'feature/'))) || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load shared pipeline defaults
        id: pipeline
        run: bash .github/scripts/load-pipeline-config.sh
      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.pipeline.outputs.helm_version }}
      - name: Lint and render the website chart
        run: |
          helm lint helm/website-helm
          mkdir -p /tmp/rendered-manifests
          helm template user1 helm/website-helm --namespace user1 \
            --set tenant.name=user1 --set ingress.host=user1.localtest.me \
            --set eventPublisher.enabled=true > /tmp/rendered-manifests/website.yaml
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.pipeline.outputs.go_version }}
      - name: Install Kubernetes manifest validator
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v${{ steps.pipeline.outputs.kubeconform_version }}
      - name: Validate rendered website resources
        run: kubeconform -strict -ignore-missing-schemas /tmp/rendered-manifests/website.yaml
      - name: Scan rendered website resources for security issues
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered-manifests
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
  build-and-validate:
    if: (github.event_name == 'pull_request' && (github.head_ref == 'master' || github.head_ref == 'feature' || startsWith(github.head_ref, 'feature/'))) || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')))
    needs: chart-validation
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service: website
      image: website
