# No-op change to allow workflow-triggering commits.
name: Website App CI
on:
  push:
    branches: [master, feature, 'feature/**']
    paths:
      - 'services/website-app/**'
      - 'VERSION'
      - 'scripts/build-version.sh'
      - '.trivyignore'
      - 'helm/website/**'
      - '.github/workflows/website_app_ci.yml'
      - '.github/workflows/website_app_cd.yml'
      - '.github/workflows/service_ci.yml'
  pull_request:
    branches: [master, feature, 'feature/**']
    paths:
      - 'services/website-app/**'
      - 'VERSION'
      - 'scripts/build-version.sh'
      - '.trivyignore'
      - 'helm/website/**'
      - '.github/workflows/website_app_ci.yml'
      - '.github/workflows/website_app_cd.yml'
      - '.github/workflows/service_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  security-events: write
jobs:
  chart-validation:
    if: (github.event_name == 'pull_request' && (github.head_ref == 'master' || github.head_ref == 'feature' || startsWith(github.head_ref, 'feature/'))) || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint and render the website chart
        run: |
          helm lint helm/website
          mkdir -p /tmp/rendered-manifests
          helm template user1 helm/website --namespace user1 \
            --set tenant.name=user1 --set ingress.host=user1.localtest.me \
            --set eventPublisher.enabled=true > /tmp/rendered-manifests/website.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install Kubernetes manifest validator
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - name: Validate rendered website resources
        run: kubeconform -strict -ignore-missing-schemas /tmp/rendered-manifests/website.yaml
      - name: Scan rendered website resources for security issues
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered-manifests
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
  build-and-validate:
    if: (github.event_name == 'pull_request' && (github.head_ref == 'master' || github.head_ref == 'feature' || startsWith(github.head_ref, 'feature/'))) || (github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature' || startsWith(github.ref, 'refs/heads/feature/')))
    needs: chart-validation
    uses: ./.github/workflows/service_ci.yml
    with:
      service: website-app
      image: website-app
